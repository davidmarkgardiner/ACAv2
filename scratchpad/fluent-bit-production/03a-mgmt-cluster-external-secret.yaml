# External Secret for Management Cluster (Argo Events EventSource)
# Syncs Event Hub credentials from Azure Key Vault
#
# Prerequisites:
# 1. External Secrets Operator installed on management cluster
# 2. ClusterSecretStore configured for Azure Key Vault
# 3. Key Vault secrets exist:
#    - eventhub-shared-access-key-name (e.g., "RootManageSharedAccessKey")
#    - eventhub-shared-access-key (the actual SAS key)
#
# To store secrets in Key Vault:
#   # Get the key name and key value
#   KEY_NAME="RootManageSharedAccessKey"
#   KEY_VALUE=$(az eventhubs namespace authorization-rule keys list \
#     --resource-group $RESOURCE_GROUP \
#     --namespace-name $EVENTHUB_NAMESPACE \
#     --name $KEY_NAME \
#     --query primaryKey -o tsv)
#
#   # Store in Key Vault
#   az keyvault secret set --vault-name $KEY_VAULT --name eventhub-shared-access-key-name --value "$KEY_NAME"
#   az keyvault secret set --vault-name $KEY_VAULT --name eventhub-shared-access-key --value "$KEY_VALUE"
#
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eventhub-listener-secret
  namespace: argo-events
  labels:
    app: k8s-event-consumer
    component: eventsource
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault        # UPDATE: Your ClusterSecretStore name
    kind: ClusterSecretStore
  target:
    name: eventhub-listener-secret
    creationPolicy: Owner
  data:
    - secretKey: sharedAccessKeyName
      remoteRef:
        key: eventhub-shared-access-key-name    # Key Vault secret name
    - secretKey: sharedAccessKey
      remoteRef:
        key: eventhub-shared-access-key         # Key Vault secret name
