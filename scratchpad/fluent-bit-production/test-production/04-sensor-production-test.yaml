# Production Test Sensor
# Processes Event Hub format payloads (base64 encoded body)
# Triggers multi-cluster-triage workflow -> Holmes -> GitLab
#
# Payload format (simulating Event Hub):
# {
#   "body": "<base64-encoded-k8s-event>",
#   "id": "test-123",
#   "partitionKey": "test"
# }
#
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: prod-test-gitlab-issues
  namespace: argo-events
  labels:
    purpose: production-testing
spec:
  eventBusName: default
  template:
    serviceAccountName: argo-events-sa

  dependencies:
    - name: k8s-warning-event
      eventSourceName: webhook-prod-test
      eventName: k8s-event

  triggers:
    - template:
        name: create-gitlab-issue
        conditions: "k8s-warning-event"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: prod-test-triage-
                labels:
                  app: k8s-event-handler
                  purpose: production-testing
              spec:
                workflowTemplateRef:
                  name: multi-cluster-triage
                serviceAccountName: argo-events-sa
                arguments:
                  parameters:
                    - name: cluster-name
                      value: ""
                    - name: namespace
                      value: ""
                    - name: resource-name
                      value: ""
                    - name: resource-kind
                      value: ""
                    - name: event-reason
                      value: ""
                    - name: event-message
                      value: ""
                    - name: gitlab-project
                      value: "xxxmarkgardiner/mcp-test-repo"
                    - name: holmes-url
                      value: "http://holmesgpt.holmesgpt.svc.cluster.local:80"
          parameters:
            # Map Event Hub payload to workflow parameters
            # Event Hub body is Base64 encoded - use b64dec function
            # Same parsing as production sensor
            - src:
                dependencyName: k8s-warning-event
                dataTemplate: '{{ (b64dec .Input.body.body) | mustFromJson | dig "cluster" "unknown" }}'
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: k8s-warning-event
                dataTemplate: '{{ (b64dec .Input.body.body) | mustFromJson | dig "involvedObject" "namespace" "default" }}'
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: k8s-warning-event
                dataTemplate: '{{ (b64dec .Input.body.body) | mustFromJson | dig "involvedObject" "name" "unknown" }}'
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: k8s-warning-event
                dataTemplate: '{{ (b64dec .Input.body.body) | mustFromJson | dig "involvedObject" "kind" "Pod" }}'
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: k8s-warning-event
                dataTemplate: '{{ (b64dec .Input.body.body) | mustFromJson | dig "reason" "Unknown" }}'
              dest: spec.arguments.parameters.4.value
            - src:
                dependencyName: k8s-warning-event
                dataTemplate: '{{ (b64dec .Input.body.body) | mustFromJson | dig "message" "" }}'
              dest: spec.arguments.parameters.5.value
      retryStrategy:
        steps: 3
        duration: 10s

---
# Debug sensor to see raw payloads (helpful for troubleshooting)
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: prod-test-debug
  namespace: argo-events
  labels:
    purpose: production-testing-debug
spec:
  eventBusName: default
  template:
    serviceAccountName: argo-events-sa

  dependencies:
    - name: any-event
      eventSourceName: webhook-prod-test
      eventName: k8s-event

  triggers:
    - template:
        name: log-raw-event
        conditions: "any-event"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: prod-test-debug-
                labels:
                  purpose: production-testing-debug
              spec:
                serviceAccountName: argo-events-sa
                entrypoint: log-event
                arguments:
                  parameters:
                    - name: raw-payload
                      value: ""
                    - name: encoded-body
                      value: ""
                    - name: decoded-body
                      value: ""
                templates:
                  - name: log-event
                    inputs:
                      parameters:
                        - name: raw-payload
                        - name: encoded-body
                        - name: decoded-body
                    script:
                      image: alpine:3.18
                      command: [sh]
                      source: |
                        echo "=== Production Test - Event Received ==="
                        echo ""
                        echo "Raw payload:"
                        echo "{{inputs.parameters.raw-payload}}"
                        echo ""
                        echo "Encoded body (base64):"
                        echo "{{inputs.parameters.encoded-body}}"
                        echo ""
                        echo "Decoded body:"
                        echo "{{inputs.parameters.decoded-body}}"
                        echo ""
                        echo "=== End Event ==="
          parameters:
            - src:
                dependencyName: any-event
                dataKey: body
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: any-event
                dataKey: body.body
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: any-event
                dataTemplate: '{{ b64dec .Input.body.body }}'
              dest: spec.arguments.parameters.2.value
