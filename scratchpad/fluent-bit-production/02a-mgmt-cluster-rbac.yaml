# RBAC for Argo Events on Management Cluster
# Required for EventSource and Sensor to submit Workflows
#
# Apply with: kubectl apply -f 02a-mgmt-cluster-rbac.yaml
#
---
# Namespace (if not exists)
apiVersion: v1
kind: Namespace
metadata:
  name: argo-events
---
# Service Account used by EventSource, Sensor, and Workflows
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-events-sa
  namespace: argo-events
  labels:
    app: argo-events
---
# Role for Argo Events components
# Allows sensors to submit workflows and manage events
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-events-role
  namespace: argo-events
rules:
  # Workflow submission
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "cronworkflows"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Sensor needs to read eventsources
  - apiGroups: ["argoproj.io"]
    resources: ["eventsources", "sensors", "eventbus"]
    verbs: ["get", "list", "watch"]
  # Pod management for workflow pods
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # ConfigMaps and Secrets access
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Events for status updates
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Service accounts
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-events-role-binding
  namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-events-role
subjects:
  - kind: ServiceAccount
    name: argo-events-sa
    namespace: argo-events
---
# ClusterRole for workflow pods that need cluster-wide access
# (e.g., if workflows need to query other namespaces)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-events-cluster-role
rules:
  # Read-only access to cluster resources for investigation
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding (optional - for cross-namespace access)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-events-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-events-cluster-role
subjects:
  - kind: ServiceAccount
    name: argo-events-sa
    namespace: argo-events
---
# EventBus (required for Argo Events communication)
# If you don't have an EventBus, sensors can't receive events!
#
# JetStream is the recommended EventBus type (NATS native is deprecated)
# https://argoproj.github.io/argo-events/concepts/eventbus/
#
# UPDATE the image to your private registry before applying
#

# ````                                                                                                                                   
#   ┌─────────────────┬───────────────────────────────────────────┬───────────────────────┐                                                                            
#   │    Container    │                   Image                   │        Purpose        │                                                                            
#   ├─────────────────┼───────────────────────────────────────────┼───────────────────────┤                                                                            
#   │ nats            │ nats:2.10.10                              │ Main NATS server      │                                                                            
#   ├─────────────────┼───────────────────────────────────────────┼───────────────────────┤                                                                            
#   │ config-reloader │ natsio/nats-server-config-reloader:0.14.0 │ Config reload sidecar │                                                                            
#   ├─────────────────┼───────────────────────────────────────────┼───────────────────────┤                                                                            
#   │ metrics         │ natsio/prometheus-nats-exporter:0.14.0    │ Metrics exporter      │                                                                            
#   └─────────────────┴───────────────────────────────────────────┴───────────────────────┘                                                                            
#   For air-gapped, you'll need to mirror all 3. The JetStream spec doesn't have the same metricsExporterImage: "" option as NATS native.      
# ```
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: argo-events
spec:
  jetstream:
    # Supported versions: latest, 2.8.1, 2.8.1-alpine, 2.8.2, 2.8.2-alpine, 2.9.1, 2.9.12, 2.9.16, 2.10.10
    version: "2.10.10"
    replicas: 3
    # Air-gapped image - UPDATE to your registry
    containerTemplate:
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
    # Persistence (optional - enable for durability)
    # persistence:
    #   storageClassName: managed-premium
    #   accessMode: ReadWriteOnce
    #   volumeSize: 10Gi
    # Stream settings
    settings: |
      max_file_store: 1GB
    # For air-gapped: override the image
    # Note: JetStream uses nats image, specify via affinity/nodeSelector or
    # check if your Argo Events controller has image override options
