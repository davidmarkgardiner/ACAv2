# Fluent Bit DEBUG ConfigMap - No Filters
# Used to inspect raw event format
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app: fluent-bit
    purpose: debug
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name              kubernetes_events
        Tag               kube.events.*
        DB                /var/log/flb_kube_events.db
        Interval_Sec      1
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token

    # NO FILTERS - raw output to see event structure
    [OUTPUT]
        Name          stdout
        Match         kube.events.*
        Format        json_lines

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
