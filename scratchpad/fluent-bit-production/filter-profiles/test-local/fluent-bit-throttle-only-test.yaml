# =============================================================================
# Fluent Bit Throttle-Only Test - Isolated Rate Limiting Test
# =============================================================================
#
# PURPOSE:
#   Test Fluent Bit throttle filter in isolation (no grep filters blocking events)
#
# TEST PROCEDURE:
#   1. Deploy this config
#   2. Generate multiple k8s events (any type, any namespace)
#   3. Watch stdout - should see max 1 event per 60 seconds
#   4. Check logs for "rate is: X per interval" messages
#
# EXPECTED:
#   - First event in window: SENT to stdout
#   - Subsequent events in same 60s window: DROPPED
#   - Print_Status shows rate limiting in action
#
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app: fluent-bit
    purpose: throttle-only-testing
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    # ==========================================================================
    # INPUT: Kubernetes Events
    # ==========================================================================
    # Captures ALL kubernetes events (Normal and Warning)
    # Interval_Sec=1 means check for new events every second
    # ==========================================================================
    [INPUT]
        Name              kubernetes_events
        Tag               kube.events.*
        DB                /var/log/flb_kube_events.db
        Interval_Sec      1
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token

    # ==========================================================================
    # NO GREP FILTERS - Let ALL events through to test throttle
    # ==========================================================================

    # ==========================================================================
    # THROTTLE FILTER - This is what we're testing
    # ==========================================================================
    # Rate: Max 1 event per 60 seconds (window)
    # Events exceeding this rate will be DROPPED
    # Print_Status: Shows "rate is: X per interval" in logs
    # ==========================================================================
    [FILTER]
        Name          throttle
        Match         kube.events.*
        Rate          1
        Window        60
        Print_Status  true

    # ==========================================================================
    # METADATA: Add tracking fields
    # ==========================================================================
    [FILTER]
        Name          modify
        Match         kube.events.*
        Add           throttle_test true
        Add           test_type throttle-only

    # ==========================================================================
    # OUTPUT: stdout for verification
    # ==========================================================================
    [OUTPUT]
        Name          stdout
        Match         kube.events.*
        Format        json_lines

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json

---
# =============================================================================
# Fluent Bit Deployment for Testing
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit-events
  namespace: monitoring
  labels:
    app: fluent-bit
    purpose: throttle-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit-events
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.2.10
          ports:
            - containerPort: 2020
              name: http
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
            - name: varlog
              mountPath: /var/log
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          emptyDir: {}
