# =============================================================================
# Fluent Bit Test Deployment - LOCAL FILTER TESTING
# =============================================================================
#
# PURPOSE:
#   Deploy Fluent Bit for local testing without EventHub dependency.
#   Use with fluent-bit-test-config.yaml which outputs to stdout.
#
# PREREQUISITES:
#   1. monitoring namespace exists
#   2. fluent-bit-test-config.yaml applied
#
# USAGE:
#   kubectl apply -f fluent-bit-test-deployment.yaml
#   kubectl wait --for=condition=ready pod -l app=fluent-bit -n monitoring
#   kubectl logs -n monitoring -l app=fluent-bit -f
#
# CLEANUP:
#   kubectl delete -f fluent-bit-test-deployment.yaml
#
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit-events
  namespace: monitoring
  labels:
    app: fluent-bit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-events
  labels:
    app: fluent-bit
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-events
  labels:
    app: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-events
subjects:
  - kind: ServiceAccount
    name: fluent-bit-events
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit-events
  namespace: monitoring
  labels:
    app: fluent-bit
    component: k8s-events
    purpose: filter-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit
      component: k8s-events
  template:
    metadata:
      labels:
        app: fluent-bit
        component: k8s-events
    spec:
      serviceAccountName: fluent-bit-events
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2020
              protocol: TCP
          env:
            - name: CLUSTER_NAME
              value: "kind-argo-workflow"
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
            - name: varlog
              mountPath: /var/log
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          emptyDir: {}
      terminationGracePeriodSeconds: 10
