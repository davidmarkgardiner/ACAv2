# =============================================================================
# Fluent Bit Test ConfigMap - LOCAL TESTING ONLY
# =============================================================================
#
# PURPOSE:
#   Test filter profiles locally without EventHub dependency.
#   Outputs to stdout so you can verify which events pass filters.
#
# USAGE:
#   1. Apply this ConfigMap:
#      kubectl apply -f fluent-bit-test-config.yaml
#
#   2. Apply the test deployment:
#      kubectl apply -f fluent-bit-test-deployment.yaml
#
#   3. Generate test events:
#      kubectl run test-pod --image=invalid-xyz -n default --restart=Never
#
#   4. Check Fluent Bit logs for captured events:
#      kubectl logs -n monitoring -l app=fluent-bit -f
#
# WHAT TO LOOK FOR:
#   - Events from whitelisted namespaces should appear in logs
#   - Events from other namespaces should NOT appear
#   - Events should have "cluster" and "filter_profile" fields
#
# CLEANUP:
#   kubectl delete deployment fluent-bit-events -n monitoring
#   kubectl delete configmap fluent-bit-config -n monitoring
#
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app: fluent-bit
    purpose: filter-testing
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    @INCLUDE inputs.conf
    @INCLUDE filters.conf
    @INCLUDE outputs.conf

  inputs.conf: |
    [INPUT]
        Name              kubernetes_events
        Tag               kube.events.*
        DB                /var/log/flb_kube_events.db
        Interval_Sec      1
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token

  # LOW NOISE FILTER PROFILE
  filters.conf: |
    # ============================================================
    # LOW NOISE PROFILE - Testing
    # Based on raw event structure from kubernetes_events input
    # ============================================================

    # Step 1: Only Warning events (not Normal)
    # Field path: type (at root level)
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         type ^Warning$

    # Step 2: WHITELIST - Only specific namespaces
    # Field path: involvedObject.namespace (nested object)
    # NOTE: Fluent Bit accesses nested JSON with dot notation
    [FILTER]
        Name          nest
        Match         kube.events.*
        Operation     lift
        Nested_under  involvedObject
        Add_prefix    involvedObject_

    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         involvedObject_namespace ^(monitoring|default|test-namespace|holmesgpt)$

    # Step 3: CRITICAL events only (expanded for testing)
    # Field path: reason (at root level)
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         reason ^(CrashLoopBackOff|OOMKilled|NodeNotReady|FailedMount|FailedScheduling|Evicted|BackOff|ImagePullBackOff|Failed|PolicyViolation)$

    # Step 4: Re-nest the involvedObject fields
    [FILTER]
        Name          nest
        Match         kube.events.*
        Operation     nest
        Wildcard      involvedObject_*
        Nest_under    involvedObject
        Remove_prefix involvedObject_

    # Step 5: Add cluster identifier
    [FILTER]
        Name          modify
        Match         kube.events.*
        Add           cluster kind-argo-workflow
        Add           filter_profile low-noise-test

  # LOCAL TESTING: stdout only
  outputs.conf: |
    [OUTPUT]
        Name          stdout
        Match         kube.events.*
        Format        json_lines

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    lastTimestamp
        Time_Format %Y-%m-%dT%H:%M:%SZ
