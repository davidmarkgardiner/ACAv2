# =============================================================================
# Fluent Bit Throttle Test - Rate Limiting at Source
# =============================================================================
#
# PURPOSE:
#   Test if Fluent Bit throttle filter actually drops events over the rate limit.
#
# TEST:
#   - Rate limit: 1 event per 60 seconds
#   - Generate multiple events rapidly
#   - Count how many appear in stdout
#
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app: fluent-bit
    purpose: throttle-testing
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name              kubernetes_events
        Tag               kube.events.*
        DB                /var/log/flb_kube_events.db
        Interval_Sec      1
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token

    # Only Warning events
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         type Warning

    # Only default namespace (for testing)
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         involvedObject.namespace ^(default)$

    # ============================================================
    # THROTTLE FILTER - This is what we're testing
    # ============================================================
    # Rate: Max 1 event per 60 seconds (window)
    # Events exceeding this should be DROPPED
    # ============================================================
    [FILTER]
        Name          throttle
        Match         kube.events.*
        Rate          1
        Window        60
        Print_Status  true

    # Add metadata to track
    [FILTER]
        Name          modify
        Match         kube.events.*
        Add           throttle_test true

    # Output to stdout for verification
    [OUTPUT]
        Name          stdout
        Match         kube.events.*
        Format        json_lines

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
