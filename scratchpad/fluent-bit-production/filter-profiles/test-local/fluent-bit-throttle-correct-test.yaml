# =============================================================================
# Fluent Bit Throttle Test - CORRECT Configuration
# =============================================================================
#
# DOCUMENTATION FINDINGS (2026-01-21):
#   - Rate: Max records allowed per INTERVAL (not per Window!)
#   - Window: Sliding window size in seconds for averaging
#   - Interval: How often to shift the window (default 1s)
#
# CORRECT CONFIG for 1 event per 60 seconds:
#   - Rate: 1 (max 1 record per interval)
#   - Window: 60 (use 60 second window for averaging)
#   - Interval: 60s (check/shift window every 60 seconds)
#
# TEST PROCEDURE:
#   1. Deploy this config
#   2. Wait for pod to be ready
#   3. Generate 5 events rapidly
#   4. Watch stdout - should see MAX 1 event per 60 seconds
#   5. Check logs for dropped message counts
#
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app: fluent-bit
    purpose: throttle-correct-test
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    # ==========================================================================
    # INPUT: Kubernetes Events
    # ==========================================================================
    [INPUT]
        Name              kubernetes_events
        Tag               kube.events.*
        DB                /var/log/flb_kube_events.db
        Interval_Sec      1
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token

    # ==========================================================================
    # FILTER: Only Warning events (reduces noise)
    # ==========================================================================
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         type Warning

    # ==========================================================================
    # FILTER: Only default namespace (for testing)
    # ==========================================================================
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         involvedObject.namespace ^default$

    # ==========================================================================
    # THROTTLE FILTER - CORRECT CONFIGURATION
    # ==========================================================================
    # This allows MAX 1 event per 60 second interval
    #
    # How it works:
    #   - Every 60 seconds (Interval), the window shifts
    #   - Max 1 record (Rate) is allowed per interval
    #   - Records exceeding rate are DROPPED
    #   - Print_Status shows dropped count in logs
    # ==========================================================================
    [FILTER]
        Name          throttle
        Match         kube.events.*
        Rate          1
        Window        60
        Interval      60s
        Print_Status  true

    # ==========================================================================
    # METADATA: Add tracking fields
    # ==========================================================================
    [FILTER]
        Name          modify
        Match         kube.events.*
        Add           throttle_test true
        Add           test_type correct-throttle
        Add           rate_limit 1-per-60s

    # ==========================================================================
    # OUTPUT: stdout for verification
    # ==========================================================================
    [OUTPUT]
        Name          stdout
        Match         kube.events.*
        Format        json_lines

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit-events
  namespace: monitoring
  labels:
    app: fluent-bit
    purpose: throttle-correct-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit
      purpose: throttle-correct-test
  template:
    metadata:
      labels:
        app: fluent-bit
        purpose: throttle-correct-test
    spec:
      serviceAccountName: fluent-bit-events
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.2.10
          ports:
            - containerPort: 2020
              name: http
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
            - name: varlog
              mountPath: /var/log
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          emptyDir: {}
