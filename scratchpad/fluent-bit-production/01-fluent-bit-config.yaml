# Fluent Bit ConfigMap - Kubernetes Events to Azure Event Hub
# PRODUCTION configuration using OAUTHBEARER with Workload Identity
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    @INCLUDE inputs.conf
    @INCLUDE filters.conf
    @INCLUDE outputs.conf

  inputs.conf: |
    [INPUT]
        Name              kubernetes_events
        Tag               kube.events.*
        DB                /var/log/flb_kube_events.db
        Interval_Sec      0.5
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token

  filters.conf: |
    # Filter to only Warning events
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         type Warning

    # Add cluster identifier
    [FILTER]
        Name          modify
        Match         kube.events.*
        Add           cluster ${CLUSTER_NAME}

    # Restructure event
    [FILTER]
        Name          nest
        Match         kube.events.*
        Operation     nest
        Wildcard      involvedObject.*
        Nest_under    involvedObject
        Remove_prefix involvedObject.

  outputs.conf: |
    # Azure Event Hub via Kafka protocol (OAUTHBEARER)
    [OUTPUT]
        Name                          kafka
        Match                         kube.events.*
        Brokers                       ${EVENTHUB_FQDN}:9093
        Topics                        ${EVENTHUB_NAME}
        
        # Security: OAUTHBEARER
        rdkafka.security.protocol     SASL_SSL
        rdkafka.sasl.mechanism        OAUTHBEARER
        rdkafka.sasl.oauthbearer.method                   oidc
        rdkafka.sasl.oauthbearer.client.id                ${AZURE_CLIENT_ID}
        rdkafka.sasl.oauthbearer.token.endpoint.url       https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
        rdkafka.sasl.oauthbearer.scope                    https://${EVENTHUB_FQDN}/.default
        # Important: Extensions for managed identity
        rdkafka.sasl.oauthbearer.extensions               logicalCluster=${EVENTHUB_FQDN},identityPoolId=${AZURE_CLIENT_ID}
        
        # Partitioning & Reliability
        rdkafka.message.key           ${involvedObject.namespace}
        rdkafka.request.required.acks 1
        rdkafka.retry.backoff.ms      500

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    lastTimestamp
        Time_Format %Y-%m-%dT%H:%M:%SZ
