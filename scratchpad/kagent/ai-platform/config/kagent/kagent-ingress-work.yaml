# ============================================================
# TLS Certificate
# ============================================================
# For AKS Istio add-on, the TLS secret MUST be in the
# istio-ingress namespace (aks-istio-system or istio-system),
# NOT in the kagent namespace.
#
# Create it:
#   kubectl create secret tls kagent-tls \
#     -n aks-istio-ingress \
#     --cert=tls.crt --key=tls.key
#
# Or if using an existing wildcard cert:
#   credentialName: your-wildcard-tls-secret
#
# Note: The AKS Istio add-on ingress gateway runs in the
# aks-istio-ingress namespace. The credentialName in the
# Gateway must reference a secret in THAT namespace.
