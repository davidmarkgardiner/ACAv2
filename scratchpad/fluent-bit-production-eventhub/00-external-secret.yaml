# External Secret - Syncs Event Hub SAS token from Azure Key Vault
#
# Prerequisites:
# 1. External Secrets Operator installed
# 2. ClusterSecretStore or SecretStore configured for Azure Key Vault
# 3. Secret "eventhub-connection-string" exists in Key Vault
#
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eventhub-sas-secret
  namespace: monitoring
  labels:
    app: fluent-bit
    component: k8s-events
spec:
  refreshInterval: 1h  # How often to sync from Key Vault

  secretStoreRef:
    name: azure-keyvault  # Reference to your ClusterSecretStore
    kind: ClusterSecretStore

  target:
    name: eventhub-sas-secret  # Name of K8s Secret to create
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # The connection string for SASL_PLAIN authentication
        connectionString: "{{ .connectionString }}"

  data:
    - secretKey: connectionString
      remoteRef:
        key: eventhub-connection-string  # Secret name in Key Vault
