# Fluent Bit ConfigMap - LOW NOISE Profile
#
# Filtering Strategy:
# - CRITICAL events only: CrashLoopBackOff, OOMKilled, NodeNotReady, FailedMount, FailedScheduling, Evicted
# - WHITELISTED namespaces only: monitoring, holmesgpt, your-app-namespace
# - Estimated: ~10-50 events/day per cluster (varies by cluster health)
#
# Use this profile for:
# - Initial rollout / testing
# - Production clusters where you want minimal noise
# - High-value alerts only
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app: fluent-bit
    filter-profile: low-noise
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    @INCLUDE inputs.conf
    @INCLUDE filters.conf
    @INCLUDE outputs.conf

  inputs.conf: |
    [INPUT]
        Name              kubernetes_events
        Tag               kube.events.*
        DB                /var/log/flb_kube_events.db
        Interval_Sec      0.5
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token

  filters.conf: |
    # ============================================================
    # LOW NOISE PROFILE
    # Only critical events from whitelisted namespaces
    # ============================================================

    # Step 1: Only Warning events (not Normal)
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         type Warning

    # Step 2: WHITELIST - Only specific namespaces
    # ADD YOUR NAMESPACES HERE (pipe-separated regex)
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         involvedObject.namespace ^(monitoring|holmesgpt|grafana-test|mattermost)$

    # Step 3: CRITICAL events only
    # CrashLoopBackOff, OOMKilled, NodeNotReady, FailedMount, FailedScheduling, Evicted
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         reason ^(CrashLoopBackOff|OOMKilled|NodeNotReady|FailedMount|FailedScheduling|Evicted)$

    # Step 4: Add cluster identifier
    [FILTER]
        Name          modify
        Match         kube.events.*
        Add           cluster ${CLUSTER_NAME}
        Add           filter_profile low-noise

    # Step 5: Restructure event for downstream processing
    [FILTER]
        Name          nest
        Match         kube.events.*
        Operation     nest
        Wildcard      involvedObject.*
        Nest_under    involvedObject
        Remove_prefix involvedObject.

  outputs.conf: |
    # Azure Event Hub via Kafka protocol (SASL_PLAIN)
    [OUTPUT]
        Name                          kafka
        Match                         kube.events.*
        Brokers                       ${EVENTHUB_FQDN}:9093
        Topics                        ${EVENTHUB_NAME}

        # Security: SASL_PLAIN with SAS token
        rdkafka.security.protocol     SASL_SSL
        rdkafka.sasl.mechanism        PLAIN
        rdkafka.sasl.username         $ConnectionString
        rdkafka.sasl.password         ${EVENTHUB_CONNECTION_STRING}

        # Reliability
        rdkafka.request.required.acks 1
        rdkafka.retry.backoff.ms      500

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    lastTimestamp
        Time_Format %Y-%m-%dT%H:%M:%SZ
