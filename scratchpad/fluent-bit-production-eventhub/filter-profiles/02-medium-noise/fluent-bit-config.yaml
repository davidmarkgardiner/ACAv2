# Fluent Bit ConfigMap - MEDIUM NOISE Profile
#
# Filtering Strategy:
# - CRITICAL + HEALTH events: CrashLoopBackOff, OOMKilled, NodeNotReady, FailedMount,
#   FailedScheduling, Evicted, Unhealthy, ProbeWarning, FailedKillPod, BackOff
# - BLACKLIST system namespaces: kube-system, kube-public, kube-node-lease, cert-manager, etc.
# - All other namespaces included
# - Estimated: ~50-200 events/day per cluster
#
# Use this profile for:
# - After successful low-noise testing
# - Application namespaces monitoring
# - Balanced noise vs coverage
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app: fluent-bit
    filter-profile: medium-noise
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    @INCLUDE inputs.conf
    @INCLUDE filters.conf
    @INCLUDE outputs.conf

  inputs.conf: |
    [INPUT]
        Name              kubernetes_events
        Tag               kube.events.*
        DB                /var/log/flb_kube_events.db
        Interval_Sec      0.5
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token

  filters.conf: |
    # ============================================================
    # MEDIUM NOISE PROFILE
    # Critical + health events, exclude system namespaces
    # ============================================================

    # Step 1: Only Warning events (not Normal)
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         type Warning

    # Step 2: BLACKLIST - Exclude system namespaces
    [FILTER]
        Name          grep
        Match         kube.events.*
        Exclude       involvedObject.namespace ^(kube-system|kube-public|kube-node-lease|cert-manager|gatekeeper-system|flux-system|external-secrets|azureserviceoperator-system|argo-events|argo|argocd|istio-system|linkerd)$

    # Step 3: CRITICAL + HEALTH events
    # Phase 1: CrashLoopBackOff, OOMKilled, NodeNotReady, FailedMount, FailedScheduling, Evicted
    # Phase 2: Unhealthy, ProbeWarning, FailedKillPod, BackOff
    [FILTER]
        Name          grep
        Match         kube.events.*
        Regex         reason ^(CrashLoopBackOff|OOMKilled|NodeNotReady|FailedMount|FailedScheduling|Evicted|Unhealthy|ProbeWarning|FailedKillPod|BackOff)$

    # Step 4: Add cluster identifier
    [FILTER]
        Name          modify
        Match         kube.events.*
        Add           cluster ${CLUSTER_NAME}
        Add           filter_profile medium-noise

    # Step 5: Restructure event for downstream processing
    [FILTER]
        Name          nest
        Match         kube.events.*
        Operation     nest
        Wildcard      involvedObject.*
        Nest_under    involvedObject
        Remove_prefix involvedObject.

  outputs.conf: |
    # Azure Event Hub via Kafka protocol (SASL_PLAIN)
    [OUTPUT]
        Name                          kafka
        Match                         kube.events.*
        Brokers                       ${EVENTHUB_FQDN}:9093
        Topics                        ${EVENTHUB_NAME}

        # Security: SASL_PLAIN with SAS token
        rdkafka.security.protocol     SASL_SSL
        rdkafka.sasl.mechanism        PLAIN
        rdkafka.sasl.username         $ConnectionString
        rdkafka.sasl.password         ${EVENTHUB_CONNECTION_STRING}

        # Reliability
        rdkafka.request.required.acks 1
        rdkafka.retry.backoff.ms      500

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    lastTimestamp
        Time_Format %Y-%m-%dT%H:%M:%SZ
