# Webhook EventSource for PRODUCTION TESTING
# Simulates Azure Event Hub by accepting same payload format
#
# Usage:
#   1. kubectl apply -f 03-webhook-eventsource.yaml
#   2. kubectl port-forward -n argo-events svc/webhook-prod-test-svc 12000:12000
#   3. curl -X POST http://localhost:12000/k8s-event -H "Content-Type: application/json" -d @test-payload-eventhub.json
#
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: webhook-prod-test
  namespace: argo-events
  labels:
    purpose: production-testing
spec:
  eventBusName: default
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    k8s-event:
      port: "12000"
      endpoint: /k8s-event
      method: POST

---
# Service to expose the webhook (for port-forwarding)
apiVersion: v1
kind: Service
metadata:
  name: webhook-prod-test-svc
  namespace: argo-events
  labels:
    purpose: production-testing
spec:
  selector:
    eventsource-name: webhook-prod-test
  ports:
    - port: 12000
      targetPort: 12000
