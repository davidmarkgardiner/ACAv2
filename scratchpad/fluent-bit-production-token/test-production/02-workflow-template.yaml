# Multi-Cluster Triage WorkflowTemplate
# Investigates issues using Holmes + creates GitLab issues
#
# Prerequisites:
# 1. HolmesGPT deployed with proper RBAC (see 05-holmes-rbac.yaml)
# 2. GitLab PAT secret (gitlab-mcp-secret)
# 3. RocketChat webhook config (optional)
#
# Holmes endpoint is configurable via HOLMES_URL parameter
#
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: multi-cluster-triage
  namespace: argo-events
  labels:
    app: multi-cluster-remediation
    purpose: production-test
spec:
  ttlStrategy:
    secondsAfterCompletion: 300
    secondsAfterSuccess: 300
    secondsAfterFailure: 600
  podGC:
    strategy: OnWorkflowCompletion
  entrypoint: main
  arguments:
    parameters:
      - name: cluster-name
        description: Source cluster name
      - name: namespace
        description: Kubernetes namespace
      - name: resource-name
        description: Resource name (pod, deployment, etc.)
      - name: resource-kind
        description: Resource kind
        default: "Pod"
      - name: event-reason
        description: Event reason (BackOff, OOMKilled, etc.)
      - name: event-message
        description: Full event message
      - name: gitlab-project
        description: GitLab project for issue creation
        default: "davidmarkgardiner/mcp-test-repo"
      - name: holmes-url
        description: Holmes API URL (set to 'skip' to bypass Holmes)
        default: "http://holmesgpt.holmesgpt.svc.cluster.local:80"

  templates:
    - name: main
      dag:
        tasks:
          - name: investigate
            template: holmes-investigate
          - name: create-issue
            template: create-gitlab-issue
            dependencies: [investigate]
            arguments:
              parameters:
                - name: analysis
                  value: "{{tasks.investigate.outputs.parameters.analysis}}"
                - name: recommendations
                  value: "{{tasks.investigate.outputs.parameters.recommendations}}"
          - name: notify-completion
            template: notify-rocketchat-completion
            dependencies: [create-issue]
            arguments:
              parameters:
                - name: issue-url
                  value: "{{tasks.create-issue.outputs.parameters.issue-url}}"
                - name: analysis
                  value: "{{tasks.investigate.outputs.parameters.analysis}}"
                - name: recommendations
                  value: "{{tasks.investigate.outputs.parameters.recommendations}}"

    # Holmes Investigation with configurable endpoint and proper error handling
    - name: holmes-investigate
      script:
        image: badouralix/curl-jq:latest
        command: [sh]
        source: |
          #!/bin/sh
          # Don't use set -e so we can handle errors gracefully

          CLUSTER="{{workflow.parameters.cluster-name}}"
          NAMESPACE="{{workflow.parameters.namespace}}"
          RESOURCE="{{workflow.parameters.resource-name}}"
          KIND="{{workflow.parameters.resource-kind}}"
          REASON="{{workflow.parameters.event-reason}}"
          MESSAGE="{{workflow.parameters.event-message}}"
          HOLMES_URL="{{workflow.parameters.holmes-url}}"

          echo "=============================================="
          echo "Holmes Investigation"
          echo "=============================================="
          echo "Cluster:   ${CLUSTER}"
          echo "Namespace: ${NAMESPACE}"
          echo "Resource:  ${KIND}/${RESOURCE}"
          echo "Reason:    ${REASON}"
          echo "Holmes:    ${HOLMES_URL}"
          echo "=============================================="

          # Check if Holmes should be skipped
          if [ "$HOLMES_URL" = "skip" ] || [ "$HOLMES_URL" = "none" ]; then
            echo ""
            echo "Holmes investigation SKIPPED (url=$HOLMES_URL)"
            echo ""

            # Generate fallback analysis
            cat > /tmp/analysis.txt << ANALYSIS_EOF
          **Automated Event Detection**

          A \`${REASON}\` event was detected for ${KIND}/\`${RESOURCE}\` in namespace \`${NAMESPACE}\` on cluster \`${CLUSTER}\`.

          **Event Details:**
          - Type: Warning
          - Reason: ${REASON}
          - Message: ${MESSAGE}

          *Note: HolmesGPT investigation was skipped. This is a basic event report.*
          ANALYSIS_EOF

            cat > /tmp/recommendations.txt << RECO_EOF
          **Recommended Actions:**

          1. Check pod logs:
             \`\`\`bash
             kubectl logs ${RESOURCE} -n ${NAMESPACE} --context ${CLUSTER}
             \`\`\`

          2. Check pod events:
             \`\`\`bash
             kubectl describe pod ${RESOURCE} -n ${NAMESPACE} --context ${CLUSTER}
             \`\`\`

          3. Check resource limits and requests

          4. Review application health probes
          RECO_EOF

            echo "Fallback analysis generated"
            exit 0
          fi

          # Build Holmes investigation request
          cat > /tmp/request.json << EOF
          {
            "source": "multi-cluster-automation",
            "title": "[${CLUSTER}] ${REASON}: ${KIND}/${RESOURCE} in ${NAMESPACE}",
            "description": "Investigate ${REASON} event for ${KIND}/${RESOURCE} in namespace ${NAMESPACE} on cluster ${CLUSTER}. Event message: ${MESSAGE}",
            "subject": {
              "name": "${RESOURCE}",
              "namespace": "${NAMESPACE}",
              "kind": "${KIND}",
              "cluster": "${CLUSTER}"
            },
            "context": {
              "cluster": "${CLUSTER}",
              "event_reason": "${REASON}",
              "runbooks": ["AKSPodNotHealthy", "AKSPodCrashLooping", "AKSOOMKilled"]
            },
            "include_tool_calls": true,
            "include_tool_call_results": true
          }
          EOF

          echo ""
          echo "Request payload:"
          cat /tmp/request.json | jq .
          echo ""

          # Test Holmes connectivity first (uses /healthz and /readyz endpoints)
          echo "Testing Holmes connectivity..."
          HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 \
            --max-time 10 \
            "${HOLMES_URL}/healthz" 2>/dev/null || echo "000")

          echo "Health check (/healthz) response: HTTP ${HEALTH_CHECK}"

          if [ "$HEALTH_CHECK" = "000" ]; then
            echo ""
            echo "ERROR: Cannot connect to Holmes at ${HOLMES_URL}"
            echo "Holmes may not be deployed or network policy is blocking access"
            echo ""
            HOLMES_AVAILABLE="false"
          elif [ "$HEALTH_CHECK" = "404" ]; then
            echo "Health endpoint not found, trying /readyz..."
            HEALTH_CHECK2=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 \
              --max-time 10 \
              "${HOLMES_URL}/readyz" 2>/dev/null || echo "000")
            echo "Readiness check (/readyz): HTTP ${HEALTH_CHECK2}"
            if [ "$HEALTH_CHECK2" = "000" ]; then
              HOLMES_AVAILABLE="false"
            else
              HOLMES_AVAILABLE="true"
            fi
          else
            HOLMES_AVAILABLE="true"
          fi

          if [ "$HOLMES_AVAILABLE" = "true" ]; then
            echo ""
            echo "Calling Holmes API (this may take up to 5 minutes)..."
            echo "Endpoint: ${HOLMES_URL}/api/investigate"
            echo ""

            # Call Holmes with verbose output
            HTTP_CODE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              "${HOLMES_URL}/api/investigate" \
              -H "Content-Type: application/json" \
              -d @/tmp/request.json \
              --connect-timeout 10 \
              --max-time 300 \
              -o /tmp/holmes_response.json 2>&1)

            # Extract HTTP code (last line)
            RESPONSE_CODE=$(echo "$HTTP_CODE" | tail -1)

            echo "Holmes API response code: ${RESPONSE_CODE}"
            echo ""

            if [ -f /tmp/holmes_response.json ]; then
              echo "Holmes response:"
              cat /tmp/holmes_response.json | jq . 2>/dev/null || cat /tmp/holmes_response.json
              echo ""

              # Check for error in response
              ERROR_MSG=$(cat /tmp/holmes_response.json | jq -r '.error // .message // empty' 2>/dev/null)
              if [ -n "$ERROR_MSG" ] && [ "$ERROR_MSG" != "null" ]; then
                echo "Holmes returned error: $ERROR_MSG"
                HOLMES_SUCCESS="false"
              elif [ "$RESPONSE_CODE" = "200" ]; then
                HOLMES_SUCCESS="true"
              else
                echo "Non-200 response from Holmes"
                HOLMES_SUCCESS="false"
              fi
            else
              echo "No response file created"
              HOLMES_SUCCESS="false"
            fi
          else
            HOLMES_SUCCESS="false"
          fi

          # Extract or generate analysis
          if [ "$HOLMES_SUCCESS" = "true" ]; then
            echo ""
            echo "Extracting analysis from Holmes response..."

            ANALYSIS=$(cat /tmp/holmes_response.json | jq -r '.analysis // .result // empty' 2>/dev/null)
            RECOMMENDATIONS=$(cat /tmp/holmes_response.json | jq -r '.recommendations // empty' 2>/dev/null)

            if [ -n "$ANALYSIS" ] && [ "$ANALYSIS" != "null" ]; then
              echo "$ANALYSIS" > /tmp/analysis.txt
              echo "Analysis extracted successfully"
            else
              echo "No analysis in response, using fallback"
              HOLMES_SUCCESS="false"
            fi

            if [ -n "$RECOMMENDATIONS" ] && [ "$RECOMMENDATIONS" != "null" ]; then
              echo "$RECOMMENDATIONS" > /tmp/recommendations.txt
            fi
          fi

          # Generate fallback if Holmes failed
          if [ "$HOLMES_SUCCESS" != "true" ]; then
            echo ""
            echo "Using fallback analysis (Holmes unavailable or returned error)"
            echo ""

            cat > /tmp/analysis.txt << ANALYSIS_EOF
          **Automated Event Detection**

          A \`${REASON}\` event was detected for ${KIND}/\`${RESOURCE}\` in namespace \`${NAMESPACE}\` on cluster \`${CLUSTER}\`.

          **Event Details:**
          - Type: Warning
          - Reason: ${REASON}
          - Message: ${MESSAGE}

          **Holmes Status:** Not available or returned an error. Manual investigation required.

          *If you see "RBAC: access denied" errors, ensure Holmes has the required ClusterRole permissions. See 05-holmes-rbac.yaml.*
          ANALYSIS_EOF
          fi

          # Generate recommendations if not already set
          if [ ! -f /tmp/recommendations.txt ] || [ ! -s /tmp/recommendations.txt ]; then
            case "$REASON" in
              OOMKilled)
                cat > /tmp/recommendations.txt << RECO_EOF
          **OOMKilled Recommendations:**

          1. Check current memory usage:
             \`\`\`bash
             kubectl top pod ${RESOURCE} -n ${NAMESPACE} --context ${CLUSTER}
             \`\`\`

          2. Review memory limits:
             \`\`\`bash
             kubectl get pod ${RESOURCE} -n ${NAMESPACE} -o jsonpath='{.spec.containers[*].resources}' --context ${CLUSTER}
             \`\`\`

          3. Check for memory leaks in application logs

          4. Consider increasing memory limits or optimizing application
          RECO_EOF
                ;;
              BackOff|CrashLoopBackOff)
                cat > /tmp/recommendations.txt << RECO_EOF
          **CrashLoopBackOff Recommendations:**

          1. Check pod logs:
             \`\`\`bash
             kubectl logs ${RESOURCE} -n ${NAMESPACE} --context ${CLUSTER} --previous
             \`\`\`

          2. Check pod events:
             \`\`\`bash
             kubectl describe pod ${RESOURCE} -n ${NAMESPACE} --context ${CLUSTER}
             \`\`\`

          3. Verify liveness/readiness probes configuration

          4. Check application startup dependencies
          RECO_EOF
                ;;
              *)
                cat > /tmp/recommendations.txt << RECO_EOF
          **General Recommendations:**

          1. Check pod logs:
             \`\`\`bash
             kubectl logs ${RESOURCE} -n ${NAMESPACE} --context ${CLUSTER}
             \`\`\`

          2. Describe the pod:
             \`\`\`bash
             kubectl describe pod ${RESOURCE} -n ${NAMESPACE} --context ${CLUSTER}
             \`\`\`

          3. Check related events:
             \`\`\`bash
             kubectl get events -n ${NAMESPACE} --context ${CLUSTER} --field-selector involvedObject.name=${RESOURCE}
             \`\`\`
          RECO_EOF
                ;;
            esac
          fi

          echo ""
          echo "=============================================="
          echo "Investigation Complete"
          echo "=============================================="
          echo ""
          echo "=== Analysis ==="
          cat /tmp/analysis.txt
          echo ""
          echo "=== Recommendations ==="
          cat /tmp/recommendations.txt
          echo ""
      outputs:
        parameters:
          - name: analysis
            valueFrom:
              path: /tmp/analysis.txt
          - name: recommendations
            valueFrom:
              path: /tmp/recommendations.txt

    # Create GitLab issue
    - name: create-gitlab-issue
      inputs:
        parameters:
          - name: analysis
          - name: recommendations
      outputs:
        parameters:
          - name: issue-url
            valueFrom:
              path: /tmp/issue_url.txt
      script:
        image: badouralix/curl-jq:latest
        command: [sh]
        env:
          - name: GITLAB_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitlab-mcp-secret
                key: GITLAB_PERSONAL_ACCESS_TOKEN
          - name: ANALYSIS
            value: "{{inputs.parameters.analysis}}"
          - name: RECOMMENDATIONS
            value: "{{inputs.parameters.recommendations}}"
        source: |
          CLUSTER="{{workflow.parameters.cluster-name}}"
          NAMESPACE="{{workflow.parameters.namespace}}"
          RESOURCE="{{workflow.parameters.resource-name}}"
          KIND="{{workflow.parameters.resource-kind}}"
          REASON="{{workflow.parameters.event-reason}}"
          MESSAGE="{{workflow.parameters.event-message}}"
          PROJECT="{{workflow.parameters.gitlab-project}}"
          WORKFLOW_NAME="{{workflow.name}}"

          ENCODED_PROJECT=$(echo "$PROJECT" | sed 's/\//%2F/g')
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          TITLE="[${CLUSTER}] ${REASON}: ${NAMESPACE}/${RESOURCE}"

          case "$REASON" in
            OOMKilled|CrashLoopBackOff) SEVERITY="severity-critical" ;;
            BackOff|ImagePullBackOff|FailedScheduling) SEVERITY="severity-high" ;;
            *) SEVERITY="severity-medium" ;;
          esac

          # Build description
          echo "## Cluster Information" > /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "- **Cluster**: ${CLUSTER}" >> /tmp/description.txt
          echo "- **Namespace**: ${NAMESPACE}" >> /tmp/description.txt
          echo "- **Resource**: ${KIND}/${RESOURCE}" >> /tmp/description.txt
          echo "- **Event**: ${REASON}" >> /tmp/description.txt
          echo "- **Workflow**: ${WORKFLOW_NAME}" >> /tmp/description.txt
          echo "- **Timestamp**: ${TIMESTAMP}" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "## Event Message" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "\`\`\`" >> /tmp/description.txt
          echo "${MESSAGE}" >> /tmp/description.txt
          echo "\`\`\`" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "## AI Analysis" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "${ANALYSIS}" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "## Recommendations" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "${RECOMMENDATIONS}" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "---" >> /tmp/description.txt
          echo "*Auto-generated by Multi-Cluster Remediation Pipeline*" >> /tmp/description.txt
          DESCRIPTION=$(cat /tmp/description.txt)

          jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESCRIPTION" \
            --arg labels "multi-cluster,auto-generated,${REASON},${CLUSTER},${SEVERITY},test" \
            '{title: $title, description: $desc, labels: $labels}' > /tmp/issue_payload.json

          echo "Creating GitLab issue in project: ${PROJECT}"

          curl -s -X POST \
            "https://gitlab.com/api/v4/projects/${ENCODED_PROJECT}/issues" \
            -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @/tmp/issue_payload.json > /tmp/gitlab_response.json

          echo "GitLab API Response:"
          cat /tmp/gitlab_response.json | jq '.' 2>/dev/null || cat /tmp/gitlab_response.json

          ISSUE_URL=$(cat /tmp/gitlab_response.json | jq -r '.web_url // empty')

          if [ -n "$ISSUE_URL" ]; then
            echo "$ISSUE_URL" > /tmp/issue_url.txt
            echo ""
            echo "Issue created: $ISSUE_URL"
          else
            ERROR=$(cat /tmp/gitlab_response.json | jq -r '.message // .error // empty')
            echo "ERROR: $ERROR" > /tmp/issue_url.txt
            echo "GitLab API Error: $ERROR"
          fi
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

    # Notify Mattermost/RocketChat with analysis and recommendations
    - name: notify-rocketchat-completion
      inputs:
        parameters:
          - name: issue-url
          - name: analysis
          - name: recommendations
      script:
        image: badouralix/curl-jq:latest
        command: [sh]
        env:
          - name: WEBHOOK_URL
            valueFrom:
              configMapKeyRef:
                name: rocketchat-webhook-config
                key: WEBHOOK_URL
                optional: true
          - name: ANALYSIS
            value: "{{inputs.parameters.analysis}}"
          - name: RECOMMENDATIONS
            value: "{{inputs.parameters.recommendations}}"
        source: |
          #!/bin/sh
          ISSUE_URL='{{inputs.parameters.issue-url}}'
          RESOURCE='{{workflow.parameters.resource-name}}'
          NAMESPACE='{{workflow.parameters.namespace}}'
          CLUSTER='{{workflow.parameters.cluster-name}}'
          REASON='{{workflow.parameters.event-reason}}'

          if [ -z "$WEBHOOK_URL" ] || [ "$WEBHOOK_URL" = "<YOUR_ROCKETCHAT_WEBHOOK_URL>" ]; then
            echo "Webhook not configured, skipping notification"
            exit 0
          fi

          # Extract first 20 lines of analysis as summary
          ANALYSIS_SUMMARY=$(echo "$ANALYSIS" | head -20)
          ANALYSIS_SUMMARY="${ANALYSIS_SUMMARY}

          _See GitLab issue for complete analysis..._"

          # Keep full recommendations - they contain the useful commands
          RECO_TEXT="$RECOMMENDATIONS"

          # Build the message with proper formatting
          cat > /tmp/payload.json << PAYLOAD_EOF
          {
            "text": "### :mag: Triage Complete: ${REASON}",
            "attachments": [
              {
                "fallback": "${REASON}: ${NAMESPACE}/${RESOURCE}",
                "color": "#3498db",
                "title": "[${CLUSTER}] ${NAMESPACE}/${RESOURCE}",
                "title_link": "${ISSUE_URL}",
                "fields": [
                  {
                    "short": true,
                    "title": "Cluster",
                    "value": "${CLUSTER}"
                  },
                  {
                    "short": true,
                    "title": "Event",
                    "value": "${REASON}"
                  }
                ]
              },
              {
                "fallback": "Analysis",
                "color": "#2ecc71",
                "title": ":brain: AI Analysis",
                "text": $(echo "$ANALYSIS_SUMMARY" | jq -Rs .)
              },
              {
                "fallback": "Recommendations",
                "color": "#e67e22",
                "title": ":wrench: Recommended Actions",
                "text": $(echo "$RECO_TEXT" | jq -Rs .)
              },
              {
                "fallback": "GitLab Issue",
                "color": "#9b59b6",
                "text": ":link: **[View Full Issue in GitLab](${ISSUE_URL})**"
              }
            ]
          }
          PAYLOAD_EOF

          echo "Sending notification to Mattermost..."
          cat /tmp/payload.json | jq .

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json \
            --max-time 10)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Response: $BODY (HTTP $HTTP_CODE)"

          if [ "$HTTP_CODE" = "200" ] || [ "$BODY" = "ok" ]; then
            echo "Notification sent successfully"
          else
            echo "Notification may have failed (non-fatal)"
          fi
