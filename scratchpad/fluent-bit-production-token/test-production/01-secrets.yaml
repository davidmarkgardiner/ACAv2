# Secrets and ConfigMaps required for production workflow
#
# IMPORTANT: Update the values before applying!
#
# To create GitLab PAT:
#   1. Go to GitLab > Settings > Access Tokens
#   2. Create token with 'api' scope
#   3. Replace <YOUR_GITLAB_PAT> below
#
# To get RocketChat webhook:
#   1. Go to RocketChat > Administration > Integrations
#   2. Create incoming webhook
#   3. Replace <YOUR_ROCKETCHAT_WEBHOOK_URL> below
#
---
# GitLab Personal Access Token
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-mcp-secret
  namespace: argo-events
  labels:
    app: multi-cluster-triage
type: Opaque
stringData:
  # Replace with your GitLab PAT (needs 'api' scope)
  GITLAB_PERSONAL_ACCESS_TOKEN: "<YOUR_GITLAB_PAT>"

---
# RocketChat Webhook Configuration (optional - for notifications)
apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketchat-webhook-config
  namespace: argo-events
  labels:
    app: multi-cluster-triage
data:
  # Replace with your RocketChat webhook URL
  # If not using RocketChat, leave as placeholder - workflow will skip notification
  WEBHOOK_URL: "<YOUR_ROCKETCHAT_WEBHOOK_URL>"
