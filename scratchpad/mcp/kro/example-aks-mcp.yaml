---
# Example Instance: AKS-MCP Server Deployment
#
# This deploys the AKS Model Context Protocol (MCP) server to enable
# AI-assisted Kubernetes operations via Claude, GitHub Copilot, Cursor, etc.
#
# Prerequisites:
# 1. Create User-Assigned Managed Identity:
#    az identity create --name uami-aks-mcp --resource-group <rg> --location <location>
#
# 2. Get Client ID:
#    CLIENT_ID=$(az identity show --name uami-aks-mcp -g <rg> --query clientId -o tsv)
#
# 3. Assign Contributor role (required for full functionality):
#    PRINCIPAL_ID=$(az identity show --name uami-aks-mcp -g <rg> --query principalId -o tsv)
#    az role assignment create --assignee-object-id $PRINCIPAL_ID \
#      --assignee-principal-type ServicePrincipal \
#      --role "Contributor" \
#      --scope /subscriptions/<sub-id>/resourceGroups/<rg>
#
# 4. Create federated credential:
#    OIDC_ISSUER=$(az aks show -g <rg> -n <cluster> --query "oidcIssuerProfile.issuerUrl" -o tsv)
#    az identity federated-credential create \
#      --name fc-aks-mcp \
#      --identity-name uami-aks-mcp \
#      --resource-group <rg> \
#      --issuer $OIDC_ISSUER \
#      --subject system:serviceaccount:aks-mcp:aks-mcp \
#      --audiences api://AzureADTokenExchange
#
# Usage:
#   kubectl apply -f example-aks-mcp.yaml
#
# Test:
#   kubectl port-forward svc/aks-mcp 8000:8000 -n aks-mcp
#   curl -X POST http://localhost:8000/mcp \
#     -H "Content-Type: application/json" \
#     -d '{"jsonrpc": "2.0", "method": "tools/list", "id": 1}'
#
apiVersion: v1alpha1
kind: UK8SAksMcp
metadata:
  name: aks-mcp-readonly
  namespace: kro-system
  labels:
    kro.run/environment: dev
spec:
  # ========================================
  # Required: Managed Identity Client ID
  # ========================================
  # Replace with your User-Assigned Managed Identity Client ID
  clientId: "00000000-0000-0000-0000-000000000000"

  # ========================================
  # Access Level
  # ========================================
  # readonly  - View cluster info, logs, events, metrics (no changes)
  # readwrite - Above + scale, restart, apply, cordon, drain
  # admin     - Above + get cluster credentials
  accessLevel: "readonly"

  # ========================================
  # Deployment Configuration
  # ========================================
  namespace: "aks-mcp"
  replicas: 2
  imageTag: "v0.0.12"

  # ========================================
  # Networking (optional)
  # ========================================
  # Leave domain empty to skip Istio VirtualService creation
  # Set domain to expose via Istio gateway
  domain: ""

  # ========================================
  # Resource Limits
  # ========================================
  cpuRequest: "100m"
  cpuLimit: "500m"
  memoryRequest: "128Mi"
  memoryLimit: "512Mi"

  # ========================================
  # Advanced Configuration
  # ========================================
  additionalTools: ""        # helm,cilium,hubble
  allowNamespaces: ""        # Restrict to specific namespaces
  logLevel: "info"           # debug, info, warn, error
  timeout: 600               # Request timeout in seconds

  # ========================================
  # Security
  # ========================================
  enableNetworkPolicy: true
  enableIstioSidecar: false

---
# Example with Istio HTTPS exposure
apiVersion: v1alpha1
kind: UK8SAksMcp
metadata:
  name: aks-mcp-with-istio
  namespace: kro-system
  labels:
    kro.run/environment: prod
spec:
  clientId: "00000000-0000-0000-0000-000000000000"
  accessLevel: "readonly"
  namespace: "aks-mcp"
  replicas: 3
  imageTag: "v0.0.12"

  # Expose via Istio external gateway
  domain: "aks-mcp.yourdomain.com"
  istioGateway: "aks-istio-ingress/aks-mcp-gateway"
  istioGatewaySelector: "aks-istio-ingressgateway-external"

  cpuRequest: "200m"
  cpuLimit: "1000m"
  memoryRequest: "256Mi"
  memoryLimit: "1Gi"

  enableNetworkPolicy: true
  enableIstioSidecar: true
