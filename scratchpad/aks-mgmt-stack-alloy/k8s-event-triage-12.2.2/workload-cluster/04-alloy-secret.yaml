---
# Event Hub Connection String Secret
# Option 1: Direct secret (for testing)
# Option 2: Use External Secrets with Azure Key Vault (recommended for production)
apiVersion: v1
kind: Secret
metadata:
  name: alloy-eventhub
  namespace: monitoring
  labels:
    app: alloy
type: Opaque
stringData:
  # Replace with actual connection string or use External Secrets
  connection-string: "{{EVENTHUB_CONNECTION_STRING}}"
