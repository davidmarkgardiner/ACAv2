# Multi-Cluster Triage WorkflowTemplate - Token Optimized
#
# CRITICAL: This workflow runs on the MANAGEMENT cluster but investigates
# REMOTE target clusters. The cluster-name parameter determines which
# cluster HolmesGPT will investigate.
#
# Key changes from original:
# - include_tool_call_results: false (saves tokens)
# - Uses mattermost-webhook-config instead of rocketchat-webhook-config
# - Explicitly passes cluster context to HolmesGPT
# - Includes cluster validation step
#
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: multi-cluster-triage
  namespace: argo-events
  labels:
    app: multi-cluster-remediation
spec:
  # Auto-cleanup: delete completed workflows after 5 minutes
  ttlStrategy:
    secondsAfterCompletion: 300
    secondsAfterSuccess: 300
    secondsAfterFailure: 600
  # Clean up pods immediately after workflow completes
  podGC:
    strategy: OnWorkflowCompletion
  entrypoint: main
  arguments:
    parameters:
      - name: cluster-name
        description: "Target cluster name (MUST be a remote cluster, not the management cluster)"
      - name: namespace
        description: Kubernetes namespace
      - name: resource-name
        description: Resource name (pod, deployment, etc.)
      - name: resource-kind
        description: Resource kind
        default: "Pod"
      - name: event-reason
        description: Event reason (BackOff, OOMKilled, etc.)
      - name: event-message
        description: Full event message
      - name: gitlab-project
        description: GitLab project for issue creation
        default: "xxxmarkgardiner/mcp-test-repo"

  templates:
    - name: main
      dag:
        tasks:
          # STEP 1: Validate target cluster is reachable
          - name: validate-cluster
            template: validate-target-cluster

          # STEP 2: Investigate on TARGET cluster
          - name: investigate
            template: holmes-investigate
            dependencies: [validate-cluster]

          # STEP 3: Create GitLab issue
          - name: create-issue
            template: create-gitlab-issue
            dependencies: [investigate]
            arguments:
              parameters:
                - name: analysis
                  value: "{{tasks.investigate.outputs.parameters.analysis}}"
                - name: recommendations
                  value: "{{tasks.investigate.outputs.parameters.recommendations}}"

          # STEP 4: Notify team
          - name: notify-completion
            template: notify-mattermost-completion
            dependencies: [create-issue]
            arguments:
              parameters:
                - name: issue-url
                  value: "{{tasks.create-issue.outputs.parameters.issue-url}}"
                - name: analysis
                  value: "{{tasks.investigate.outputs.parameters.analysis}}"
                - name: recommendations
                  value: "{{tasks.investigate.outputs.parameters.recommendations}}"

    # Validate that target cluster is accessible
    - name: validate-target-cluster
      script:
        image: mcr.microsoft.com/azure-cli:2.64.0
        command: [bash]
        source: |
          #!/bin/bash
          set -e

          CLUSTER="{{workflow.parameters.cluster-name}}"
          MGMT_CLUSTER="${HOLMES_MGMT_CLUSTER:-aks-mgmt-cluster}"

          echo "=== Target Cluster Validation ==="
          echo "Target Cluster: $CLUSTER"
          echo "Management Cluster: $MGMT_CLUSTER"

          # SAFETY CHECK: Never investigate management cluster from itself
          if [ "$CLUSTER" = "$MGMT_CLUSTER" ]; then
            echo "ERROR: Cannot investigate the management cluster from itself!"
            echo "This workflow is designed for remote cluster investigation only."
            exit 1
          fi

          # Check if cluster context exists
          if kubectl config get-contexts "$CLUSTER" &>/dev/null; then
            echo "Context for '$CLUSTER' exists"
          else
            echo "Context not found, fetching credentials..."

            # Read cluster details from ConfigMap (mounted in workflow)
            # For now, try to get credentials using naming convention
            # Format: cluster-name matches AKS cluster name
            RESOURCE_GROUP="${CLUSTER}-rg"

            # Try common resource group patterns
            for RG in "${CLUSTER}-rg" "rg-${CLUSTER}" "${CLUSTER}"; do
              echo "Trying resource group: $RG"
              if az aks get-credentials --resource-group "$RG" --name "$CLUSTER" --overwrite-existing 2>/dev/null; then
                echo "Successfully fetched credentials from RG: $RG"
                break
              fi
            done
          fi

          # Test connectivity
          echo ""
          echo "Testing connectivity to cluster: $CLUSTER"
          kubectl config use-context "$CLUSTER"

          if kubectl cluster-info &>/dev/null; then
            echo "Cluster '$CLUSTER' is reachable"
            echo ""
            echo "Cluster nodes:"
            kubectl get nodes --no-headers 2>/dev/null | head -3 || true
          else
            echo "ERROR: Cannot reach cluster '$CLUSTER'"
            exit 1
          fi

          echo ""
          echo "=== Validation Complete ==="
        env:
          - name: HOLMES_MGMT_CLUSTER
            value: "aks-mgmt-cluster"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

    # Holmes Investigation with EXPLICIT multi-cluster context
    - name: holmes-investigate
      script:
        image: badouralix/curl-jq:latest
        command: [sh]
        source: |
          #!/bin/sh
          set -e

          CLUSTER="{{workflow.parameters.cluster-name}}"
          NAMESPACE="{{workflow.parameters.namespace}}"
          RESOURCE="{{workflow.parameters.resource-name}}"
          KIND="{{workflow.parameters.resource-kind}}"
          REASON="{{workflow.parameters.event-reason}}"
          MESSAGE="{{workflow.parameters.event-message}}"

          echo "=== HolmesGPT Investigation Request ==="
          echo "Target Cluster: $CLUSTER"
          echo "Namespace: $NAMESPACE"
          echo "Resource: $KIND/$RESOURCE"
          echo "Event: $REASON"
          echo ""

          # Build Holmes investigation request with EXPLICIT cluster context
          # CRITICAL: The cluster field tells Holmes which cluster to investigate
          # TOKEN OPTIMIZATION: include_tool_call_results set to false
          cat > /tmp/request.json << EOF
          {
            "source": "multi-cluster-automation",
            "title": "[${CLUSTER}] ${REASON}: ${KIND}/${RESOURCE} in ${NAMESPACE}",
            "description": "IMPORTANT: Investigate this issue on cluster '${CLUSTER}', NOT the local management cluster.\n\nInvestigate ${REASON} event for ${KIND}/${RESOURCE} in namespace ${NAMESPACE}.\n\nEvent message: ${MESSAGE}",
            "subject": {
              "name": "${RESOURCE}",
              "namespace": "${NAMESPACE}",
              "kind": "${KIND}",
              "cluster": "${CLUSTER}"
            },
            "context": {
              "cluster": "${CLUSTER}",
              "target_cluster": "${CLUSTER}",
              "event_reason": "${REASON}",
              "investigation_scope": "remote_cluster_only",
              "runbooks": ["AKSPodNotHealthy", "AKSPodCrashLooping", "AKSOOMKilled"]
            },
            "instructions": "CRITICAL: You MUST investigate cluster '${CLUSTER}', NOT the local cluster. Use kubectl with --context=${CLUSTER} for all commands. Before running any kubectl command, verify you are targeting the correct cluster.",
            "include_tool_calls": true,
            "include_tool_call_results": false
          }
          EOF

          echo "Request payload:"
          cat /tmp/request.json
          echo ""

          # Call Holmes API with cluster context header
          RESPONSE=$(curl -s -X POST \
            "http://holmesgpt.holmesgpt.svc.cluster.local:80/api/investigate" \
            -H "Content-Type: application/json" \
            -H "X-Target-Cluster: ${CLUSTER}" \
            -d @/tmp/request.json \
            --max-time 300 || echo '{"error": "Holmes API timeout"}')

          echo "=== Holmes Response Received ==="

          # Extract analysis
          ANALYSIS=$(echo "$RESPONSE" | jq -r '.analysis // .result // "Investigation completed but no detailed analysis available."')

          # Handle null/empty values
          if [ "$ANALYSIS" = "null" ] || [ -z "$ANALYSIS" ]; then
            ANALYSIS="Investigation completed for cluster ${CLUSTER}. Event: ${REASON} for ${KIND}/${RESOURCE} in ${NAMESPACE}."
          fi

          # Add cluster context banner to analysis
          ANALYSIS_WITH_CONTEXT="## Target Cluster: ${CLUSTER}

          ${ANALYSIS}"

          # Extract "Next Steps" section from analysis (Holmes embeds recommendations in analysis)
          RECOMMENDATIONS=$(echo "$ANALYSIS" | sed -n '/# Next Steps/,/^# /p' | head -n -1)
          if [ -z "$RECOMMENDATIONS" ]; then
            RECOMMENDATIONS=$(echo "$ANALYSIS" | sed -n '/Next Steps/,/^#/p' | head -n -1)
          fi
          if [ -z "$RECOMMENDATIONS" ]; then
            RECOMMENDATIONS="Check the full analysis in GitLab for recommended actions."
          fi

          echo "$ANALYSIS_WITH_CONTEXT" > /tmp/analysis.txt
          echo "$RECOMMENDATIONS" > /tmp/recommendations.txt

          echo "Investigation complete for cluster: $CLUSTER"
      outputs:
        parameters:
          - name: analysis
            valueFrom:
              path: /tmp/analysis.txt
          - name: recommendations
            valueFrom:
              path: /tmp/recommendations.txt

    # Create GitLab issue with cluster context
    - name: create-gitlab-issue
      inputs:
        parameters:
          - name: analysis
          - name: recommendations
      outputs:
        parameters:
          - name: issue-url
            valueFrom:
              path: /tmp/issue_url.txt
      script:
        image: badouralix/curl-jq:latest
        command: [sh]
        env:
          - name: GITLAB_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitlab-mcp-secret
                key: GITLAB_PERSONAL_ACCESS_TOKEN
          - name: ANALYSIS
            value: "{{inputs.parameters.analysis}}"
          - name: RECOMMENDATIONS
            value: "{{inputs.parameters.recommendations}}"
        source: |
          CLUSTER="{{workflow.parameters.cluster-name}}"
          NAMESPACE="{{workflow.parameters.namespace}}"
          RESOURCE="{{workflow.parameters.resource-name}}"
          KIND="{{workflow.parameters.resource-kind}}"
          REASON="{{workflow.parameters.event-reason}}"
          MESSAGE="{{workflow.parameters.event-message}}"
          PROJECT="{{workflow.parameters.gitlab-project}}"
          WORKFLOW_NAME="{{workflow.name}}"

          ENCODED_PROJECT=$(echo "$PROJECT" | sed 's/\//%2F/g')
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Build issue title with cluster prefix
          TITLE="[${CLUSTER}] ${REASON}: ${NAMESPACE}/${RESOURCE}"

          # Determine severity label
          case "$REASON" in
            OOMKilled|CrashLoopBackOff) SEVERITY="severity-critical" ;;
            BackOff|ImagePullBackOff|FailedScheduling) SEVERITY="severity-high" ;;
            *) SEVERITY="severity-medium" ;;
          esac

          # Build description line by line
          echo "## Issue Summary" > /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "| Field | Value |" >> /tmp/description.txt
          echo "|-------|-------|" >> /tmp/description.txt
          echo "| **Target Cluster** | \`${CLUSTER}\` |" >> /tmp/description.txt
          echo "| **Namespace** | \`${NAMESPACE}\` |" >> /tmp/description.txt
          echo "| **Resource** | \`${KIND}/${RESOURCE}\` |" >> /tmp/description.txt
          echo "| **Event** | \`${REASON}\` |" >> /tmp/description.txt
          echo "| **Timestamp** | ${TIMESTAMP} |" >> /tmp/description.txt
          echo "| **Workflow** | ${WORKFLOW_NAME} |" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "> **Note:** This issue was investigated on cluster \`${CLUSTER}\`, not the management cluster." >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "## Event Message" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "\`\`\`" >> /tmp/description.txt
          echo "${MESSAGE}" >> /tmp/description.txt
          echo "\`\`\`" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "## AI Analysis" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "${ANALYSIS}" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "## Quick Commands" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "Copy and paste these commands to investigate further:" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "\`\`\`bash" >> /tmp/description.txt
          echo "# IMPORTANT: First switch to the TARGET cluster context" >> /tmp/description.txt
          echo "az aks get-credentials --resource-group <RG> --name ${CLUSTER} --overwrite-existing" >> /tmp/description.txt
          echo "kubectl config use-context ${CLUSTER}" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "# Verify you're on the correct cluster" >> /tmp/description.txt
          echo "kubectl config current-context" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "# Check pod status" >> /tmp/description.txt
          echo "kubectl get pod ${RESOURCE} -n ${NAMESPACE} -o wide" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "# View pod events" >> /tmp/description.txt
          echo "kubectl describe pod ${RESOURCE} -n ${NAMESPACE} | tail -30" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "# Check pod logs" >> /tmp/description.txt
          echo "kubectl logs ${RESOURCE} -n ${NAMESPACE} --tail=100" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "# Check resource limits" >> /tmp/description.txt
          echo "kubectl get pod ${RESOURCE} -n ${NAMESPACE} -o jsonpath='{.spec.containers[*].resources}'" >> /tmp/description.txt
          echo "\`\`\`" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "## Recommended Actions" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "${RECOMMENDATIONS}" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "---" >> /tmp/description.txt
          echo "*Auto-generated by Multi-Cluster Remediation Pipeline (Management Cluster)*" >> /tmp/description.txt

          DESCRIPTION=$(cat /tmp/description.txt)

          # GitLab assignee
          ASSIGNEE_ID="11798868"

          # Use jq to safely build JSON payload
          jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESCRIPTION" \
            --arg labels "multi-cluster,auto-generated,${REASON},${CLUSTER},${SEVERITY}" \
            --arg assignee "$ASSIGNEE_ID" \
            '{title: $title, description: $desc, labels: $labels, assignee_ids: [$assignee | tonumber]}' > /tmp/issue_payload.json

          echo "Creating GitLab issue in project: ${PROJECT}"
          echo "Cluster context: ${CLUSTER}"

          curl -s -X POST \
            "https://gitlab.com/api/v4/projects/${ENCODED_PROJECT}/issues" \
            -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @/tmp/issue_payload.json > /tmp/gitlab_response.json

          ISSUE_URL=$(cat /tmp/gitlab_response.json | jq -r '.web_url // empty')

          if [ -n "$ISSUE_URL" ]; then
            echo "$ISSUE_URL" > /tmp/issue_url.txt
            echo "Issue created successfully: $ISSUE_URL"
          else
            ERROR=$(cat /tmp/gitlab_response.json | jq -r '.message // .error // empty')
            if [ -n "$ERROR" ]; then
              echo "ERROR: $ERROR" > /tmp/issue_url.txt
              echo "GitLab API Error: $ERROR"
            else
              echo "https://gitlab.com/${PROJECT}/issues" > /tmp/issue_url.txt
              echo "Warning: Could not extract issue URL"
            fi
          fi
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

    # Notify Mattermost with completion and GitLab link
    - name: notify-mattermost-completion
      inputs:
        parameters:
          - name: issue-url
          - name: analysis
          - name: recommendations
      script:
        image: badouralix/curl-jq:latest
        command: [sh]
        env:
          - name: WEBHOOK_URL
            valueFrom:
              configMapKeyRef:
                name: mattermost-webhook-config
                key: WEBHOOK_URL
          - name: ANALYSIS
            value: "{{inputs.parameters.analysis}}"
          - name: RECOMMENDATIONS
            value: "{{inputs.parameters.recommendations}}"
        source: |
          #!/bin/sh
          ISSUE_URL='{{inputs.parameters.issue-url}}'
          RESOURCE='{{workflow.parameters.resource-name}}'
          NAMESPACE='{{workflow.parameters.namespace}}'
          REASON='{{workflow.parameters.event-reason}}'
          CLUSTER='{{workflow.parameters.cluster-name}}'

          # Truncate analysis to first 800 chars
          ANALYSIS_SHORT=$(echo "$ANALYSIS" | jq -Rs '.[0:800]' | jq -r '.')
          ANALYSIS_LEN=$(echo "$ANALYSIS" | wc -c)
          if [ "$ANALYSIS_LEN" -gt 800 ]; then
            ANALYSIS_SHORT="${ANALYSIS_SHORT}..."
          fi

          # Truncate recommendations to 500 chars for Mattermost
          RECS_SHORT=$(echo "$RECOMMENDATIONS" | jq -Rs '.[0:500]' | jq -r '.')
          RECS_LEN=$(echo "$RECOMMENDATIONS" | wc -c)
          if [ "$RECS_LEN" -gt 500 ]; then
            RECS_SHORT="${RECS_SHORT}..."
          fi

          # Build quick kubectl commands with EXPLICIT cluster context
          QUICK_CMDS=$(printf "# Switch to TARGET cluster first\naz aks get-credentials --resource-group <RG> --name %s\nkubectl config use-context %s\n\n# Verify cluster\nkubectl config current-context\n\n# Investigate\nkubectl get pod %s -n %s -o wide\nkubectl describe pod %s -n %s | tail -30\nkubectl logs %s -n %s --tail=100" "$CLUSTER" "$CLUSTER" "$RESOURCE" "$NAMESPACE" "$RESOURCE" "$NAMESPACE" "$RESOURCE" "$NAMESPACE")

          # Build Mattermost payload
          jq -n \
            --arg issue_url "$ISSUE_URL" \
            --arg title "[${CLUSTER}] ${REASON}: ${NAMESPACE}/${RESOURCE}" \
            --arg analysis "$ANALYSIS_SHORT" \
            --arg recommendations "$RECS_SHORT" \
            --arg commands "$QUICK_CMDS" \
            --arg cluster "$CLUSTER" \
            '{
              username: "Argo Triage Bot",
              icon_emoji: ":robot:",
              text: ("### :white_check_mark: Triage Complete\n**" + $title + "**\n:warning: *Investigated on cluster: `" + $cluster + "`*"),
              attachments: [
                {
                  fallback: ("Analysis for " + $title),
                  color: "#2ecc71",
                  title: "AI Analysis",
                  text: $analysis
                },
                {
                  fallback: "Quick Commands",
                  color: "#e67e22",
                  title: ("Quick Commands (Target: " + $cluster + ")"),
                  text: ("```\n" + $commands + "\n```")
                },
                {
                  fallback: "Recommended Fix",
                  color: "#9b59b6",
                  title: "Recommended Fix",
                  text: $recommendations
                },
                {
                  fallback: "GitLab Issue Link",
                  color: "#3498db",
                  title: "GitLab Issue",
                  title_link: $issue_url,
                  text: (":link: [View Full Details](" + $issue_url + ")")
                }
              ]
            }' > /tmp/payload.json

          echo "Sending notification to Mattermost..."
          echo "Cluster: $CLUSTER"
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json \
            --max-time 10 || echo "Notification failed"
