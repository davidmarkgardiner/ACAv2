# Secrets Template for AKS Management Stack
# Copy this file and fill in the values before applying
#
# IMPORTANT: Do NOT commit actual secrets to git!
#
---
# Event Hub listener secret for Argo Events
apiVersion: v1
kind: Secret
metadata:
  name: eventhub-listener-secret
  namespace: argo-events
type: Opaque
stringData:
  # Get these from Azure Portal > Event Hub > Shared access policies
  sharedAccessKeyName: "RootManageSharedAccessKey"  # Or your custom policy name
  sharedAccessKey: "<YOUR_SAS_KEY_HERE>"
---
# HolmesGPT API secrets
apiVersion: v1
kind: Secret
metadata:
  name: holmes-secrets
  namespace: holmesgpt
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<YOUR_ANTHROPIC_API_KEY>"
  OPENAI_API_KEY: ""  # Optional, leave empty if using Anthropic only
---
# GitLab PAT for issue creation
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-mcp-secret
  namespace: argo-events
type: Opaque
stringData:
  GITLAB_PERSONAL_ACCESS_TOKEN: "<YOUR_GITLAB_PAT>"
---
# PostgreSQL secret for Mattermost
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: mattermost
type: Opaque
stringData:
  POSTGRES_USER: "mattermost"
  POSTGRES_PASSWORD: "mattermost-secure-password"
  POSTGRES_DB: "mattermost"
