---
# Event Hub credentials for Alloy (monitoring namespace)
# REPLACE connection-string with your Event Hub connection string
apiVersion: v1
kind: Secret
metadata:
  name: alloy-eventhub
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: k8s-event-triage
type: Opaque
stringData:
  connection-string: "REPLACE_WITH_EVENTHUB_CONNECTION_STRING"
---
# Event Hub credentials for Argo Events EventSource (argo-events namespace)
# Same connection string, different namespace
apiVersion: v1
kind: Secret
metadata:
  name: eventhub-credentials
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: k8s-event-triage
type: Opaque
stringData:
  username: "$ConnectionString"
  connection-string: "REPLACE_WITH_EVENTHUB_CONNECTION_STRING"
---
# TLS CA Certificate for Event Hub Kafka endpoint
# Argo Events v1.9.x REQUIRES caCertSecret — tls: {} fails validation
# Generate once per Event Hub namespace (cert rarely changes):
#
#   echo | openssl s_client -connect <EVENTHUB_NAMESPACE>.servicebus.windows.net:9093 \
#     -showcerts 2>/dev/null \
#     | awk '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/' \
#     > /tmp/eventhub-ca-chain.pem
#
#   kubectl create secret generic eventhub-tls-ca -n argo-events \
#     --from-file=ca.pem=/tmp/eventhub-ca-chain.pem
#
# DO NOT apply this as YAML — use the kubectl create command above
