---
# Alloy ConfigMap - Collects K8s Warning events and sends to Event Hub via OTLP/Kafka
# REPLACE all placeholders before applying
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
  labels:
    app: alloy
    app.kubernetes.io/part-of: k8s-event-triage
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    // =========================================================================
    // Collect K8s events from target namespaces
    // IMPORTANT: Exclude argo, argo-events, monitoring, kube-system
    //            to prevent feedback loops (workflow pods generate events)
    // =========================================================================
    loki.source.kubernetes_events "cluster_events" {
      namespaces = [
        "default",
        // Add your application namespaces here:
        // "my-app-ns",
      ]
      job_name   = "kubernetes-events"
      log_format = "json"

      forward_to = [loki.process.enrich.receiver]
    }

    // =========================================================================
    // Enrich events with cluster metadata + extract fields as labels
    // =========================================================================
    loki.process "enrich" {
      // REPLACE with your cluster details
      stage.static_labels {
        values = {
          cluster     = "REPLACE_CLUSTER_NAME",
          environment = "REPLACE_ENVIRONMENT",
          region      = "REPLACE_AZURE_REGION",
          source      = "alloy",
        }
      }

      // Parse K8s event JSON
      stage.json {
        expressions = {
          event_type     = "type",
          event_reason   = "reason",
          event_message  = "message",
          event_count    = "count",
          obj_kind       = "involvedObject.kind",
          obj_name       = "involvedObject.name",
          obj_namespace  = "involvedObject.namespace",
        }
      }

      // Promote to labels (become OTLP attributes downstream)
      stage.labels {
        values = {
          event_type    = "",
          event_reason  = "",
          obj_kind      = "",
          obj_namespace = "",
        }
      }

      // Rate limit: prevent event storms
      stage.limit {
        rate  = 10
        burst = 25
        drop  = true
      }

      forward_to = [otelcol.receiver.loki.bridge.receiver]
    }

    // =========================================================================
    // Loki -> OTLP bridge -> Kafka export to Event Hub
    // =========================================================================
    otelcol.receiver.loki "bridge" {
      output {
        logs = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      timeout         = "2s"
      send_batch_size = 100
      output {
        logs = [otelcol.exporter.kafka.eventhub.input]
      }
    }

    otelcol.exporter.kafka "eventhub" {
      // REPLACE with your Event Hub namespace
      brokers          = ["REPLACE_EVENTHUB_NAMESPACE.servicebus.windows.net:9093"]
      protocol_version = "1.0.0"

      logs {
        // REPLACE with your Event Hub name
        topic    = "REPLACE_EVENTHUB_NAME"
        encoding = "otlp_json"
      }

      authentication {
        tls {
          insecure = false
        }
        sasl {
          username  = "$ConnectionString"
          password  = sys.env("EVENTHUB_CONNECTION_STRING")
          mechanism = "PLAIN"
        }
      }

      sending_queue {
        enabled    = true
        queue_size = 1000
      }
    }
---
# Alloy Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app: alloy
    app.kubernetes.io/part-of: k8s-event-triage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.12.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - containerPort: 12345
              name: http
          env:
            - name: EVENTHUB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: alloy-eventhub
                  key: connection-string
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 12345
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app: alloy
    app.kubernetes.io/part-of: k8s-event-triage
---
# ClusterRole - Alloy needs to watch K8s events
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-k8s-events
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-k8s-events
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: alloy-k8s-events
  apiGroup: rbac.authorization.k8s.io
---
# Service for health checks
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app: alloy
    app.kubernetes.io/part-of: k8s-event-triage
spec:
  selector:
    app: alloy
  ports:
    - port: 12345
      targetPort: 12345
      name: http
