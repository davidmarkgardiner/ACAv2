# ============================================================
# Argo Workflow Step: Create Gitea Issue for Triaged K8s Event
# ============================================================
#
# This snippet is intended to be embedded inside an existing
# WorkflowTemplate that performs LLM triage of K8s events.
#
# Expected upstream parameters / artifacts (passed by prior steps):
#   - create-issue       (string "true" / "false")
#   - cluster            (string)
#   - namespace          (string)
#   - event-reason       (string)
#   - event-name         (string)
#   - event-message      (string)
#   - llm-severity       (string: critical | high | medium | low)
#   - llm-remediation    (string)

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: k8s-event-triage
  namespace: argo
spec:
  entrypoint: triage-pipeline
  arguments:
    parameters:
      - name: cluster
      - name: namespace
      - name: event-reason
      - name: event-name
      - name: event-message
      - name: llm-severity
        value: "medium"
      - name: llm-remediation
        value: ""
      - name: create-issue
        value: "false"

  templates:

    # ─────────────────────────────────────────────
    # Main pipeline DAG
    # ─────────────────────────────────────────────
    - name: triage-pipeline
      dag:
        tasks:
          # Prior steps (shown for context / wiring)
          - name: llm-triage
            template: llm-triage-stub

          # Conditionally create Gitea issue
          - name: create-gitea-issue
            template: create-gitea-issue
            when: "\"{{workflow.parameters.create-issue}}\" == \"true\""
            dependencies: [llm-triage]
            arguments:
              parameters:
                - name: cluster
                  value: "{{workflow.parameters.cluster}}"
                - name: namespace
                  value: "{{workflow.parameters.namespace}}"
                - name: event-reason
                  value: "{{workflow.parameters.event-reason}}"
                - name: event-name
                  value: "{{workflow.parameters.event-name}}"
                - name: event-message
                  value: "{{workflow.parameters.event-message}}"
                - name: llm-severity
                  value: "{{workflow.parameters.llm-severity}}"
                - name: llm-remediation
                  value: "{{workflow.parameters.llm-remediation}}"

    # ─────────────────────────────────────────────
    # Stub: represents your existing LLM triage step
    # Replace with your real template reference.
    # ─────────────────────────────────────────────
    - name: llm-triage-stub
      container:
        image: alpine:3.19
        command: [sh, -c, "echo 'LLM triage complete'"]

    # ─────────────────────────────────────────────
    # Core step: Create Gitea Issue
    # ─────────────────────────────────────────────
    - name: create-gitea-issue
      inputs:
        parameters:
          - name: cluster
          - name: namespace
          - name: event-reason
          - name: event-name
          - name: event-message
          - name: llm-severity
          - name: llm-remediation
      container:
        image: badouralix/curl-jq:alpine
        command: [sh, -c]
        args:
          - |
            set -e

            # ── Load credentials from secret volume ──────────────────────
            GITEA_URL=$(cat /etc/gitea/url)
            GITEA_TOKEN=$(cat /etc/gitea/token)
            REPO_OWNER=$(cat /etc/gitea/repo-owner)
            REPO_NAME=$(cat /etc/gitea/repo-name)

            CLUSTER="{{inputs.parameters.cluster}}"
            NAMESPACE="{{inputs.parameters.namespace}}"
            REASON="{{inputs.parameters.event-reason}}"
            NAME="{{inputs.parameters.event-name}}"
            MESSAGE="{{inputs.parameters.event-message}}"
            SEVERITY="{{inputs.parameters.llm-severity}}"
            REMEDIATION="{{inputs.parameters.llm-remediation}}"

            # ── Build issue title ─────────────────────────────────────────
            TITLE="[K8S-TRIAGE] ${REASON}: ${NAME} in ${NAMESPACE}"

            # ── Build issue body (Markdown) ───────────────────────────────
            BODY="## Kubernetes Event Triage Report\n\n\
            | Field | Value |\n\
            |---|---|\n\
            | **Cluster** | \`${CLUSTER}\` |\n\
            | **Namespace** | \`${NAMESPACE}\` |\n\
            | **Event Name** | \`${NAME}\` |\n\
            | **Reason** | \`${REASON}\` |\n\
            | **Severity** | **${SEVERITY}** |\n\n\
            ### Message\n\
            \`\`\`\n\
            ${MESSAGE}\n\
            \`\`\`\n\n\
            ### Suggested Remediation\n\
            ${REMEDIATION}\n\n\
            ---\n\
            *Auto-generated by k8s-event-triage workflow at $(date -u +\"%Y-%m-%dT%H:%M:%SZ\")*"

            # ── Map severity to Gitea label ───────────────────────────────
            # Labels must already exist in the Gitea repo (see labels-bootstrap.yaml)
            case "${SEVERITY}" in
              critical) SEVERITY_LABEL="severity:critical" ;;
              high)     SEVERITY_LABEL="severity:high"     ;;
              medium)   SEVERITY_LABEL="severity:medium"   ;;
              *)        SEVERITY_LABEL="severity:low"      ;;
            esac

            # ── Build JSON payload ────────────────────────────────────────
            PAYLOAD=$(jq -n \
              --arg title    "${TITLE}"         \
              --arg body     "${BODY}"          \
              --arg sev      "${SEVERITY_LABEL}" \
              '{
                title: $title,
                body:  $body,
                labels: ["triage", "k8s-event", $sev]
              }')

            echo "Creating Gitea issue: ${TITLE}"
            echo "Endpoint: ${GITEA_URL}/api/v1/repos/${REPO_OWNER}/${REPO_NAME}/issues"

            # ── POST to Gitea API ─────────────────────────────────────────
            # --fail-with-body returns a non-zero exit on HTTP 4xx/5xx but
            # we capture it so the workflow step never hard-fails on
            # network / connectivity issues (|| true).
            HTTP_STATUS=$(curl -s -o /tmp/gitea-response.json -w "%{http_code}" \
              --max-time 15 \
              --retry 2 \
              --retry-delay 3 \
              --retry-connrefused \
              -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              "${GITEA_URL}/api/v1/repos/${REPO_OWNER}/${REPO_NAME}/issues" \
              -d "${PAYLOAD}") || true

            # ── Evaluate outcome ──────────────────────────────────────────
            if [ "${HTTP_STATUS}" = "201" ]; then
              ISSUE_URL=$(jq -r '.html_url // "unknown"' /tmp/gitea-response.json)
              ISSUE_NUM=$(jq -r '.number // "?"'         /tmp/gitea-response.json)
              echo "✅  Issue #${ISSUE_NUM} created: ${ISSUE_URL}"
            else
              echo "⚠️  Gitea issue creation skipped (HTTP ${HTTP_STATUS}). Workflow continues."
              echo "    Response body:"
              cat /tmp/gitea-response.json || true
              # Exit 0 — soft failure; do NOT block the workflow
              exit 0
            fi

        # ── Mount gitea-credentials secret as individual files ──────────
        volumeMounts:
          - name: gitea-creds
            mountPath: /etc/gitea
            readOnly: true

      volumes:
        - name: gitea-creds
          secret:
            secretName: gitea-credentials
            # Each key becomes a file: /etc/gitea/url, /etc/gitea/token, etc.

      # ── Resource limits ───────────────────────────────────────────────
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

      # ── Retry on transient failures (not on success or soft-fail) ─────
      retryStrategy:
        limit: "2"
        retryPolicy: OnError
