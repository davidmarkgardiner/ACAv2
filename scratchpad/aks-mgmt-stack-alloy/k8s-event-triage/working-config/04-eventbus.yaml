---
# EventBus - JetStream (NATS) for internal event routing
# EventSource -> EventBus -> Sensor
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: k8s-event-triage
spec:
  jetstream:
    version: "2.10.10"
    replicas: 1
    persistence:
      storageClassName: managed-csi
      accessMode: ReadWriteOnce
      volumeSize: 5Gi
