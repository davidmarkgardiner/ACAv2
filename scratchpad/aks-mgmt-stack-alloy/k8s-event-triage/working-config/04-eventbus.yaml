---
# EventBus - Native NATS for internal event routing
# EventSource -> EventBus -> Sensor
# Native NATS is simpler than JetStream — no persistence, no clustering issues
# Trade-off: events in-flight are lost if NATS restarts (fine for event triage)
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: k8s-event-triage
spec:
  nats:
    native:
      replicas: 3
      auth: token
      # # To use your own registry, uncomment:
      # containerTemplate:
      #   resources:
      #     requests:
      #       cpu: 50m
      #       memory: 128Mi
      #   imagePullPolicy: Always
      # # Override the NATS image:
      # natsImage: "your-registry.azurecr.io/nats:2.9.23"
      # # Override the metrics exporter:
      # metricsImage: "your-registry.azurecr.io/natsio/prometheus-nats-exporter:0.14.0"
