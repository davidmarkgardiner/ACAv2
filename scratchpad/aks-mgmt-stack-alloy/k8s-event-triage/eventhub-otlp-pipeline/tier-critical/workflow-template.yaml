---
# Workflow Template - Critical Tier
# Filters: critical reasons only (CrashLoopBackOff, OOMKilled, etc.)
# Backend: Cloud VLLM for fast, capable analysis
# SLA: Must be handled
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: k8s-triage-critical
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: k8s-event-triage
    triage-tier: critical
spec:
  serviceAccountName: argo-events-sa
  entrypoint: triage-pipeline
  ttlStrategy:
    secondsAfterCompletion: 300
    secondsAfterSuccess: 120
    secondsAfterFailure: 600
  podGC:
    strategy: OnPodCompletion
  arguments:
    parameters:
      - name: otlp-payload
        description: "Full OTLP JSON envelope from Event Hub"
  templates:
    - name: triage-pipeline
      steps:
        - - name: parse-otlp
            template: parse-otlp
            arguments:
              parameters:
                - name: otlp-payload
                  value: "{{workflow.parameters.otlp-payload}}"
        - - name: process-event
            template: analyze-and-alert
            withParam: "{{steps.parse-otlp.outputs.parameters.events}}"
            arguments:
              parameters:
                - name: cluster
                  value: "{{item.cluster}}"
                - name: environment
                  value: "{{item.environment}}"
                - name: event-type
                  value: "{{item.event_type}}"
                - name: event-reason
                  value: "{{item.event_reason}}"
                - name: event-message
                  value: "{{item.event_message}}"
                - name: object-kind
                  value: "{{item.object_kind}}"
                - name: object-name
                  value: "{{item.object_name}}"
                - name: object-namespace
                  value: "{{item.object_namespace}}"
                - name: event-time
                  value: "{{item.event_time}}"
                - name: event-count
                  value: "{{item.event_count}}"

    # -------------------------------------------------------------------------
    # Parse OTLP — CRITICAL reasons only
    # -------------------------------------------------------------------------
    - name: parse-otlp
      inputs:
        parameters:
          - name: otlp-payload
      outputs:
        parameters:
          - name: events
            valueFrom:
              path: /tmp/events.json
          - name: event-count
            valueFrom:
              path: /tmp/event-count.txt
      script:
        image: badouralix/curl-jq:alpine
        command: [sh]
        source: |
          cat > /tmp/otlp_input.json << '__OTLP_EOF__'
          {{inputs.parameters.otlp-payload}}
          __OTLP_EOF__

          # Parse OTLP envelope, extract K8s events, filter critical reasons
          jq '
            # Convert OTLP attribute array [{key,value}] to object
            def attrs: [.[]? | {(.key): (.value.stringValue // (.value.intValue // .value.boolValue // "" | tostring))}] | add // {};

            # Critical reasons filter
            def is_critical: . as $r | ["CrashLoopBackOff","OOMKilled","OOMKilling","FailedScheduling","NodeNotReady","NodeNotSchedulable","FailedMount","FailedAttachVolume"] | any(. == $r);

            [
              .resourceLogs[]? |
              (.resource.attributes // [] | attrs) as $res |
              .scopeLogs[]?.logRecords[]? |
              (.attributes // [] | attrs) as $a |
              (.body.stringValue // "" | if . != "" then (fromjson? // {}) else {} end) as $ev |

              ($a.event_reason // $ev.reason // "") as $reason |
              ($a.event_type // $ev.type // "") as $type |

              select($type == "Warning" and ($reason | is_critical)) |

              {
                cluster:          ($a.cluster // $res.cluster // "unknown"),
                environment:      ($a.environment // $res.environment // "unknown"),
                event_type:       $type,
                event_reason:     $reason,
                event_message:    ($ev.message // ""),
                object_kind:      ($a.obj_kind // $ev.involvedObject.kind // ""),
                object_name:      ($ev.involvedObject.name // ""),
                object_namespace: ($a.obj_namespace // $ev.involvedObject.namespace // ""),
                event_time:       ($ev.lastTimestamp // $ev.firstTimestamp // ""),
                event_count:      ($ev.count // 1 | tostring)
              }
            ]
          ' /tmp/otlp_input.json > /tmp/events.json

          COUNT=$(jq length /tmp/events.json)
          echo "$COUNT" > /tmp/event-count.txt
          echo "[CRITICAL] $COUNT critical event(s) from OTLP payload"
          jq -r '.[] | "  - \(.event_reason): \(.object_kind)/\(.object_name) in \(.object_namespace)"' /tmp/events.json
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

    # -------------------------------------------------------------------------
    # KAgent analysis + Mattermost alert
    # Critical events MUST be alerted
    # Calls KAgent via A2A protocol — KAgent knows which VLLM it's connected to
    # -------------------------------------------------------------------------
    - name: analyze-and-alert
      inputs:
        parameters:
          - name: cluster
          - name: environment
          - name: event-type
          - name: event-reason
          - name: event-message
          - name: object-kind
          - name: object-name
          - name: object-namespace
          - name: event-time
          - name: event-count
      script:
        image: badouralix/curl-jq:alpine
        command: [sh]
        env:
          - name: WEBHOOK_URL
            valueFrom:
              configMapKeyRef:
                name: mattermost-webhook-config
                key: WEBHOOK_URL
          - name: KAGENT_URL
            valueFrom:
              configMapKeyRef:
                name: kagent-config
                key: KAGENT_URL
          - name: KAGENT_AGENT
            valueFrom:
              configMapKeyRef:
                name: kagent-config
                key: KAGENT_CRITICAL_AGENT
        source: |
          REASON="{{inputs.parameters.event-reason}}"
          EMOJI=":red_circle:"
          COLOR="#e74c3c"

          echo "[CRITICAL] $REASON: {{inputs.parameters.object-kind}}/{{inputs.parameters.object-name}}"

          cat > /tmp/event_message.txt << '__MSG_EOF__'
          {{inputs.parameters.event-message}}
          __MSG_EOF__

          EVENT_MSG=$(cat /tmp/event_message.txt | head -c 1000)

          # --- Step 1: KAgent A2A Analysis ---
          ANALYSIS="(KAgent not reachable)"

          # Build A2A message/send request
          # A2A trailing slash is REQUIRED
          jq -n \
            --arg reason "$REASON" \
            --arg kind "{{inputs.parameters.object-kind}}" \
            --arg name "{{inputs.parameters.object-name}}" \
            --arg namespace "{{inputs.parameters.object-namespace}}" \
            --arg message "$EVENT_MSG" \
            --arg cluster "{{inputs.parameters.cluster}}" \
            --arg id "critical-$(date +%s)" \
            '{
              jsonrpc: "2.0",
              method: "message/send",
              id: $id,
              params: {
                message: {
                  role: "user",
                  parts: [{
                    text: ("CRITICAL K8s Event on cluster " + $cluster + ":\nReason: " + $reason + "\nObject: " + $kind + "/" + $name + "\nCRITICAL: use exact namespace \"" + $namespace + "\"\nMessage: " + $message + "\n\nTriage this critical event. Provide root cause analysis and recommended remediation actions.")
                  }]
                }
              }
            }' > /tmp/kagent_request.json

          echo "Calling KAgent agent: $KAGENT_AGENT"

          KAGENT_RESPONSE=$(curl -s --max-time 120 \
            -X POST "${KAGENT_URL}/api/a2a/kagent/${KAGENT_AGENT}/" \
            -H "Content-Type: application/json" \
            -d @/tmp/kagent_request.json)

          # Extract analysis from A2A response
          KAGENT_STATUS=$(echo "$KAGENT_RESPONSE" | jq -r '.result.status.state // "unknown"' 2>/dev/null)
          ANALYSIS=$(echo "$KAGENT_RESPONSE" | jq -r '.result.artifacts[0].parts[0].text // "(no analysis returned)"' 2>/dev/null)

          echo "KAgent status: $KAGENT_STATUS"
          echo "Analysis: $(echo "$ANALYSIS" | head -c 200)..."

          # --- Step 2: Mattermost Alert (always) ---
          jq -n \
            --arg emoji "$EMOJI" \
            --arg color "$COLOR" \
            --arg cluster "{{inputs.parameters.cluster}}" \
            --arg environment "{{inputs.parameters.environment}}" \
            --arg event_reason "{{inputs.parameters.event-reason}}" \
            --arg object_kind "{{inputs.parameters.object-kind}}" \
            --arg object_name "{{inputs.parameters.object-name}}" \
            --arg object_namespace "{{inputs.parameters.object-namespace}}" \
            --arg event_count "{{inputs.parameters.event-count}}" \
            --arg event_time "{{inputs.parameters.event-time}}" \
            --arg event_message "$EVENT_MSG" \
            --arg analysis "$ANALYSIS" \
            '{
              username: "K8s Critical Alert",
              icon_emoji: ":rotating_light:",
              text: ($emoji + " **CRITICAL: " + $event_reason + "** on " + $cluster),
              attachments: [
                {
                  fallback: ($event_reason + " - critical"),
                  color: $color,
                  title: ($object_kind + "/" + $object_name),
                  text: ("| Field | Value |\n|-------|-------|\n| **Cluster** | `" + $cluster + "` |\n| **Environment** | `" + $environment + "` |\n| **Namespace** | `" + $object_namespace + "` |\n| **Reason** | " + $event_reason + " |\n| **Count** | " + $event_count + " |\n| **Time** | " + $event_time + " |")
                },
                {
                  fallback: "Event Message",
                  color: $color,
                  title: "Event Message",
                  text: $event_message
                },
                {
                  fallback: "AI Analysis",
                  color: "#3498db",
                  title: ":robot_face: AI Analysis (KAgent)",
                  text: $analysis
                }
              ] + (if ($object_kind == "Pod") then [{
                fallback: "Quick Commands",
                color: "#2ecc71",
                title: "Quick Commands",
                text: ("```\nkubectl describe pod " + $object_name + " -n " + $object_namespace + " | tail -30\nkubectl logs " + $object_name + " -n " + $object_namespace + " --tail=50\nkubectl get events -n " + $object_namespace + " --field-selector involvedObject.name=" + $object_name + "\n```")
              }] else [] end)
            }' > /tmp/mattermost.json

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @/tmp/mattermost.json \
            --max-time 10)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "Mattermost: HTTP $HTTP_CODE"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
