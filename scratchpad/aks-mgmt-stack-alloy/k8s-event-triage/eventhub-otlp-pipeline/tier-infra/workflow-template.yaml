---
# Workflow Template - Infra Catch-All Tier
# Filters: Warning events from core infrastructure namespaces
# Backend: Mattermost notification only (to start — add VLLM later)
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: k8s-triage-infra
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: k8s-event-triage
    triage-tier: infra
spec:
  serviceAccountName: argo-events-sa
  entrypoint: triage-pipeline
  ttlStrategy:
    secondsAfterCompletion: 120
    secondsAfterSuccess: 60
    secondsAfterFailure: 300
  podGC:
    strategy: OnPodCompletion
  arguments:
    parameters:
      - name: otlp-payload
  templates:
    - name: triage-pipeline
      steps:
        - - name: parse-otlp
            template: parse-otlp
            arguments:
              parameters:
                - name: otlp-payload
                  value: "{{workflow.parameters.otlp-payload}}"
        - - name: process-event
            template: notify
            withParam: "{{steps.parse-otlp.outputs.parameters.events}}"
            arguments:
              parameters:
                - name: cluster
                  value: "{{item.cluster}}"
                - name: environment
                  value: "{{item.environment}}"
                - name: event-type
                  value: "{{item.event_type}}"
                - name: event-reason
                  value: "{{item.event_reason}}"
                - name: event-message
                  value: "{{item.event_message}}"
                - name: object-kind
                  value: "{{item.object_kind}}"
                - name: object-name
                  value: "{{item.object_name}}"
                - name: object-namespace
                  value: "{{item.object_namespace}}"
                - name: event-time
                  value: "{{item.event_time}}"
                - name: event-count
                  value: "{{item.event_count}}"

    # -------------------------------------------------------------------------
    # Parse OTLP — Infra namespace filter
    # Only processes events from core infrastructure namespaces
    # -------------------------------------------------------------------------
    - name: parse-otlp
      inputs:
        parameters:
          - name: otlp-payload
      outputs:
        parameters:
          - name: events
            valueFrom:
              path: /tmp/events.json
          - name: event-count
            valueFrom:
              path: /tmp/event-count.txt
      script:
        image: python:3.11-alpine
        command: [sh]
        source: |
          cat > /tmp/otlp_input.json << '__OTLP_EOF__'
          {{inputs.parameters.otlp-payload}}
          __OTLP_EOF__

          python3 << '__PYTHON_EOF__'
          import json

          # Core infrastructure namespaces to monitor
          # Add/remove namespaces as you expand coverage
          INFRA_NAMESPACES = {
              "external-dns",
              "cert-manager",
              "ingress-nginx",
              "kube-system",
              "monitoring",
              "argo-events",
              "argo",
          }

          with open("/tmp/otlp_input.json") as f:
              payload = json.load(f)

          events = []

          for resource_log in payload.get("resourceLogs", []):
              res_attrs = {}
              for attr in resource_log.get("resource", {}).get("attributes", []):
                  key = attr.get("key", "")
                  val = attr.get("value", {})
                  res_attrs[key] = val.get("stringValue", str(val.get("intValue", val.get("boolValue", ""))))

              for scope_log in resource_log.get("scopeLogs", []):
                  for record in scope_log.get("logRecords", []):
                      attrs = {}
                      for attr in record.get("attributes", []):
                          key = attr.get("key", "")
                          val = attr.get("value", {})
                          attrs[key] = val.get("stringValue", str(val.get("intValue", val.get("boolValue", ""))))

                      body_str = record.get("body", {}).get("stringValue", "")
                      try:
                          k8s_event = json.loads(body_str) if body_str else {}
                      except (json.JSONDecodeError, TypeError):
                          k8s_event = {}

                      event_type = attrs.get("event_type", k8s_event.get("type", ""))
                      namespace = attrs.get("obj_namespace", k8s_event.get("involvedObject", {}).get("namespace", ""))

                      # INFRA FILTER: Warning type + infra namespace
                      if event_type != "Warning" or namespace not in INFRA_NAMESPACES:
                          continue

                      reason = attrs.get("event_reason", k8s_event.get("reason", ""))

                      events.append({
                          "cluster": attrs.get("cluster", res_attrs.get("cluster", "unknown")),
                          "environment": attrs.get("environment", res_attrs.get("environment", "unknown")),
                          "event_type": event_type,
                          "event_reason": reason,
                          "event_message": k8s_event.get("message", ""),
                          "object_kind": attrs.get("obj_kind", k8s_event.get("involvedObject", {}).get("kind", "")),
                          "object_name": k8s_event.get("involvedObject", {}).get("name", ""),
                          "object_namespace": namespace,
                          "event_time": k8s_event.get("lastTimestamp", k8s_event.get("firstTimestamp", "")),
                          "event_count": str(k8s_event.get("count", 1)),
                      })

          with open("/tmp/events.json", "w") as f:
              json.dump(events, f)
          with open("/tmp/event-count.txt", "w") as f:
              f.write(str(len(events)))

          print(f"[INFRA] {len(events)} infra warning(s) from OTLP payload")
          for e in events:
              print(f"  - {e['event_reason']}: {e['object_kind']}/{e['object_name']} in {e['object_namespace']}")
          __PYTHON_EOF__
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

    # -------------------------------------------------------------------------
    # Mattermost notification only (to start)
    # Add VLLM analysis later once pattern is proven
    # -------------------------------------------------------------------------
    - name: notify
      inputs:
        parameters:
          - name: cluster
          - name: environment
          - name: event-type
          - name: event-reason
          - name: event-message
          - name: object-kind
          - name: object-name
          - name: object-namespace
          - name: event-time
          - name: event-count
      script:
        image: badouralix/curl-jq:alpine
        command: [sh]
        env:
          - name: WEBHOOK_URL
            valueFrom:
              configMapKeyRef:
                name: mattermost-webhook-config
                key: WEBHOOK_URL
        source: |
          REASON="{{inputs.parameters.event-reason}}"

          # Severity for color coding
          case "$REASON" in
            OOMKilled|CrashLoopBackOff|FailedScheduling|NodeNotReady)
              EMOJI=":red_circle:" ; COLOR="#e74c3c" ;;
            BackOff|Failed|Unhealthy|FailedMount|FailedAttachVolume)
              EMOJI=":large_orange_circle:" ; COLOR="#e67e22" ;;
            Killing|Evicted|FailedCreate)
              EMOJI=":warning:" ; COLOR="#f1c40f" ;;
            *)
              EMOJI=":gear:" ; COLOR="#95a5a6" ;;
          esac

          cat > /tmp/event_message.txt << '__MSG_EOF__'
          {{inputs.parameters.event-message}}
          __MSG_EOF__

          EVENT_MSG=$(cat /tmp/event_message.txt | head -c 500)

          jq -n \
            --arg emoji "$EMOJI" \
            --arg color "$COLOR" \
            --arg cluster "{{inputs.parameters.cluster}}" \
            --arg environment "{{inputs.parameters.environment}}" \
            --arg event_reason "{{inputs.parameters.event-reason}}" \
            --arg object_kind "{{inputs.parameters.object-kind}}" \
            --arg object_name "{{inputs.parameters.object-name}}" \
            --arg object_namespace "{{inputs.parameters.object-namespace}}" \
            --arg event_count "{{inputs.parameters.event-count}}" \
            --arg event_time "{{inputs.parameters.event-time}}" \
            --arg event_message "$EVENT_MSG" \
            '{
              username: "K8s Infra Monitor",
              icon_emoji: ":gear:",
              text: ($emoji + " **[Infra] " + $event_reason + "** in " + $object_namespace + " on " + $cluster),
              attachments: [
                {
                  fallback: ($event_reason + " in " + $object_namespace),
                  color: $color,
                  title: ($object_kind + "/" + $object_name),
                  text: ("| Field | Value |\n|-------|-------|\n| **Namespace** | `" + $object_namespace + "` |\n| **Reason** | " + $event_reason + " |\n| **Count** | " + $event_count + " |\n| **Time** | " + $event_time + " |")
                },
                {
                  fallback: "Message",
                  color: $color,
                  text: $event_message
                }
              ]
            }' > /tmp/mattermost.json

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @/tmp/mattermost.json \
            --max-time 10)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "[INFRA] $REASON in {{inputs.parameters.object-namespace}} -> Mattermost HTTP $HTTP_CODE"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
