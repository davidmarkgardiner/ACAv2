apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: holmes
spec:
  schema:
    apiVersion: v1alpha1
    kind: Holmes
    spec:
      name: string | default=holmes
      namespace: string | default=holmesgpt
      # Azure Workload Identity
      azure:
        clientId: string | default=""
      # LLM Configuration
      llm:
        provider: string | default=openai
        openaiApiKey: string | default=""
        anthropicApiKey: string | default=""
      # Deployment Configuration
      deployment:
        image: string | default=robustadev/holmes:0.18.2
        replicas: integer | default=1
        resources:
          cpuRequest: string | default=100m
          memoryRequest: string | default=2048Mi
          memoryLimit: string | default=2048Mi
      # Feature Toggles (use "true" or "false" strings for ConfigMap compatibility)
      toolsets:
        kubernetes:
          enabled: string | default="true"
        logs:
          enabled: string | default="true"
        robusta:
          enabled: string | default="true"
        internet:
          enabled: string | default="true"
        prometheus:
          enabled: string | default="true"
      # MCP Server Configuration
      mcp:
        enabled: boolean | default=false
        url: string | default=http://localhost:8000/sse
        description: string | default=MCP server for cluster operations
    status:
      availableReplicas: ${deployment.status.availableReplicas}
      deploymentConditions: ${deployment.status.conditions}
  resources:
    # Namespace
    - id: holmesNamespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${schema.spec.namespace}

    # ServiceAccount with Azure Workload Identity
    - id: serviceaccount
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.spec.name}
          namespace: ${schema.spec.namespace}
          annotations:
            azure.workload.identity/client-id: ${schema.spec.azure.clientId}
          labels:
            azure.workload.identity/use: "true"

    # ClusterRole - Read-only access for Kubernetes troubleshooting
    - id: clusterrole
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: ${schema.spec.name}-cluster-role
        rules:
          - apiGroups: ["storage.k8s.io"]
            resources: [storageclasses]
            verbs: [list, get, watch]
          - apiGroups: ["metrics.k8s.io"]
            resources: [pods, nodes]
            verbs: [get, list]
          - apiGroups: [""]
            resources:
              - configmaps
              - daemonsets
              - deployments
              - events
              - namespaces
              - persistentvolumes
              - persistentvolumeclaims
              - pods
              - pods/status
              - pods/log
              - replicasets
              - replicationcontrollers
              - services
              - serviceaccounts
              - endpoints
              - nodes
            verbs: [get, list, watch]
          - apiGroups: ["apiregistration.k8s.io"]
            resources: [apiservices]
            verbs: [get, list]
          - apiGroups: ["rbac.authorization.k8s.io"]
            resources: [clusterroles, clusterrolebindings, roles, rolebindings]
            verbs: [get, list, watch]
          - apiGroups: ["autoscaling"]
            resources: [horizontalpodautoscalers]
            verbs: [get, list, watch]
          - apiGroups: ["apps"]
            resources:
              - daemonsets
              - deployments
              - deployments/scale
              - replicasets
              - replicasets/scale
              - statefulsets
            verbs: [get, list, watch]
          - apiGroups: ["extensions"]
            resources:
              - daemonsets
              - deployments
              - deployments/scale
              - ingresses
              - replicasets
              - replicasets/scale
              - replicationcontrollers/scale
            verbs: [get, list, watch]
          - apiGroups: ["batch"]
            resources: [cronjobs, jobs]
            verbs: [get, list, watch]
          - apiGroups: ["events.k8s.io"]
            resources: [events]
            verbs: [get, list]
          - apiGroups: ["apiextensions.k8s.io"]
            resources: [customresourcedefinitions]
            verbs: [list, get]
          - apiGroups: ["networking.k8s.io"]
            resources: [ingresses, networkpolicies]
            verbs: [get, list, watch]
          - apiGroups: ["policy"]
            resources: [poddisruptionbudgets, podsecuritypolicies]
            verbs: [get, list]
          - apiGroups: ["monitoring.coreos.com"]
            resources:
              - alertmanagers
              - alertmanagerconfigs
              - prometheuses
              - prometheusagents
              - thanosrulers
              - scrapeconfigs
              - servicemonitors
              - podmonitors
              - probes
              - prometheusrules
            verbs: [get, list, watch]

    # ClusterRoleBinding
    - id: clusterrolebinding
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: ${schema.spec.name}-cluster-role-binding
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: ${schema.spec.name}-cluster-role
        subjects:
          - kind: ServiceAccount
            name: ${schema.spec.name}
            namespace: ${schema.spec.namespace}

    # ConfigMap for toolset configuration
    - id: toolsetsconfigmap
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.spec.name}-toolsets
          namespace: ${schema.spec.namespace}
        data:
          custom_toolset.yaml: |
            toolsets:
              kubernetes/core:
                enabled: ${schema.spec.toolsets.kubernetes.enabled}
              kubernetes/logs:
                enabled: ${schema.spec.toolsets.logs.enabled}
              robusta:
                enabled: ${schema.spec.toolsets.robusta.enabled}
              internet:
                enabled: ${schema.spec.toolsets.internet.enabled}
              prometheus/metrics:
                enabled: ${schema.spec.toolsets.prometheus.enabled}
          model_list.yaml: |
            {}

    # ConfigMap for Holmes configuration
    - id: configconfigmap
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.spec.name}-config
          namespace: ${schema.spec.namespace}
        data:
          config.yaml: |
            # HolmesGPT configuration file
            custom_runbooks:
              - /etc/holmes/runbooks/dns-troubleshooting.yaml
              - /etc/holmes/runbooks/cert-manager.yaml
              - /etc/holmes/runbooks/aks-troubleshooting.yaml
            max_steps: 40

    # ConfigMap for custom runbooks
    - id: runbooksconfigmap
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.spec.name}-runbooks
          namespace: ${schema.spec.namespace}
        data:
          dns-troubleshooting.yaml: |
            runbooks:
              - match:
                  issue_name: "(DNS)|(CoreDNS)|(name.*resolution)|(nslookup)"
                instructions: >
                  Diagnose DNS resolution issues in the cluster.
                  1. Check CoreDNS pods status: kubectl get pods -n kube-system -l k8s-app=kube-dns
                  2. Review CoreDNS logs: kubectl logs -n kube-system -l k8s-app=kube-dns --tail=200
                  3. Test DNS resolution from a pod: kubectl run -it --rm debug --image=busybox -- nslookup kubernetes.default
                  4. Check CoreDNS ConfigMap: kubectl get configmap coredns -n kube-system -o yaml
                  5. Verify DNS service exists: kubectl get svc kube-dns -n kube-system
                  6. Check for NetworkPolicies blocking DNS: kubectl get networkpolicies -A
          cert-manager.yaml: |
            runbooks:
              - match:
                  issue_name: "(Certificate)|(cert-manager)|(TLS)|(ACME)|(Let.*Encrypt)"
                instructions: >
                  Diagnose why cert-manager is not issuing certificates.
                  1. Check cert-manager pods: kubectl get pods -n cert-manager
                  2. Get Certificate status: kubectl describe certificate <name> -n <namespace>
                  3. Find CertificateRequest: kubectl get certificaterequest -n <namespace>
                  4. Check Issuer/ClusterIssuer: kubectl describe clusterissuer <name>
                  5. For ACME, check Order and Challenge: kubectl get order,challenge -n <namespace>
                  6. Review cert-manager logs: kubectl logs -n cert-manager deploy/cert-manager
          aks-troubleshooting.yaml: |
            runbooks:
              - match:
                  issue_name: "(AKS)|(Azure.*Kubernetes)|(node.*not.*ready)|(cluster.*upgrade)"
                instructions: >
                  Diagnose Azure Kubernetes Service (AKS) issues.
                  1. Use AKS MCP server to get cluster information
                  2. Check node pool status and conditions
                  3. Review control plane logs via AKS diagnostics
                  4. Check Azure resource health for the cluster
                  5. Verify VNet and NSG configurations
                  6. Check for Azure Policy violations affecting the cluster

    # Secret for API keys
    - id: secret
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${schema.spec.name}-secrets
          namespace: ${schema.spec.namespace}
        type: Opaque
        stringData:
          OPENAI_API_KEY: ${schema.spec.llm.openaiApiKey}
          ANTHROPIC_API_KEY: ${schema.spec.llm.anthropicApiKey}

    # Deployment
    - id: deployment
      readyWhen:
        - ${deployment.status.availableReplicas == deployment.spec.replicas}
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}
          namespace: ${schema.spec.namespace}
          labels:
            app: ${schema.spec.name}
        spec:
          replicas: ${schema.spec.deployment.replicas}
          revisionHistoryLimit: 10
          selector:
            matchLabels:
              app: ${schema.spec.name}
          template:
            metadata:
              labels:
                app: ${schema.spec.name}
                azure.workload.identity/use: "true"
            spec:
              serviceAccountName: ${schema.spec.name}
              containers:
                - name: holmes
                  image: ${schema.spec.deployment.image}
                  imagePullPolicy: Always
                  command: ["python3", "-u", "server.py"]
                  ports:
                    - containerPort: 5050
                      name: http
                  livenessProbe:
                    tcpSocket:
                      port: 5050
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 5
                  readinessProbe:
                    tcpSocket:
                      port: 5050
                    initialDelaySeconds: 15
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 5
                  env:
                    - name: LOG_LEVEL
                      value: INFO
                    - name: ENABLE_TELEMETRY
                      value: "true"
                    - name: OPENAI_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: ${schema.spec.name}-secrets
                          key: OPENAI_API_KEY
                    - name: ANTHROPIC_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: ${schema.spec.name}-secrets
                          key: ANTHROPIC_API_KEY
                  lifecycle:
                    preStop:
                      exec:
                        command: ["bash", "-c", "kill -SIGINT 1"]
                  volumeMounts:
                    - name: playbooks-config-secret
                      mountPath: /etc/robusta/config
                    - name: custom-toolsets
                      mountPath: /etc/holmes/config
                    - name: runbooks
                      mountPath: /etc/holmes/runbooks
                    - name: config
                      mountPath: /root/.holmes
                  resources:
                    requests:
                      cpu: ${schema.spec.deployment.resources.cpuRequest}
                      memory: ${schema.spec.deployment.resources.memoryRequest}
                    limits:
                      memory: ${schema.spec.deployment.resources.memoryLimit}
              volumes:
                - name: playbooks-config-secret
                  secret:
                    secretName: robusta-playbooks-config-secret
                    optional: true
                - name: custom-toolsets
                  configMap:
                    name: ${schema.spec.name}-toolsets
                    optional: true
                - name: runbooks
                  configMap:
                    name: ${schema.spec.name}-runbooks
                    optional: true
                - name: config
                  configMap:
                    name: ${schema.spec.name}-config
                    optional: true

    # Service
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}gpt
          namespace: ${schema.spec.namespace}
          labels:
            app: ${schema.spec.name}
        spec:
          selector:
            app: ${schema.spec.name}
          ports:
            - name: http
              protocol: TCP
              port: 80
              targetPort: 5050
