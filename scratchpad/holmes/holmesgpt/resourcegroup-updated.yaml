apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: holmes
spec:
  schema:
    apiVersion: v1alpha1
    kind: Holmes
    spec:
      name: string | default=holmes
      namespace: string | default=holmesgpt
      # Azure Workload Identity
      azure:
        clientId: string | default=""
      # LLM Configuration (via LiteLLM gateway to Azure OpenAI)
      llm:
        model: string | default=gpt-4o
        litellmBaseUrl: string | default=http://litellm.litellm.svc.cluster.local:4000
      # Deployment Configuration
      deployment:
        image: string | default=robustadev/holmes:0.18.2
        replicas: integer | default=1
        resources:
          cpuRequest: string | default=100m
          memoryRequest: string | default=1Gi
          memoryLimit: string | default=2Gi
      # Feature Toggles (use "true" or "false" strings for ConfigMap compatibility)
      toolsets:
        kubernetes:
          enabled: string | default="true"
        logs:
          enabled: string | default="true"
        robusta:
          enabled: string | default="false"
        internet:
          enabled: string | default="true"
        prometheus:
          enabled: string | default="false"
      # MCP Server Configuration
      mcp:
        enabled: boolean | default=true
        url: string | default=http://aks-mcp.aks-mcp.svc.cluster.local:8000/mcp
        mode: string | default=streamable-http
    status:
      availableReplicas: ${deployment.status.availableReplicas}
      deploymentConditions: ${deployment.status.conditions}
  resources:
    # Namespace
    - id: holmesNamespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${schema.spec.namespace}

    # ServiceAccount with Azure Workload Identity
    - id: serviceaccount
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.spec.namespace}-${schema.spec.name}-service-account
          namespace: ${schema.spec.namespace}
          annotations:
            azure.workload.identity/client-id: ${schema.spec.azure.clientId}
          labels:
            azure.workload.identity/use: "true"

    # ClusterRole - Read-only access for Kubernetes troubleshooting
    - id: clusterrole
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: ${schema.spec.name}-cluster-role
        rules:
          - apiGroups: ["storage.k8s.io"]
            resources: [storageclasses]
            verbs: [list, get, watch]
          - apiGroups: ["metrics.k8s.io"]
            resources: [pods, nodes]
            verbs: [get, list]
          - apiGroups: [""]
            resources:
              - configmaps
              - daemonsets
              - deployments
              - events
              - namespaces
              - persistentvolumes
              - persistentvolumeclaims
              - pods
              - pods/status
              - pods/log
              - replicasets
              - replicationcontrollers
              - services
              - serviceaccounts
              - endpoints
              - nodes
            verbs: [get, list, watch]
          - apiGroups: ["apiregistration.k8s.io"]
            resources: [apiservices]
            verbs: [get, list]
          - apiGroups: ["rbac.authorization.k8s.io"]
            resources: [clusterroles, clusterrolebindings, roles, rolebindings]
            verbs: [get, list, watch]
          - apiGroups: ["autoscaling"]
            resources: [horizontalpodautoscalers]
            verbs: [get, list, watch]
          - apiGroups: ["apps"]
            resources:
              - daemonsets
              - deployments
              - deployments/scale
              - replicasets
              - replicasets/scale
              - statefulsets
            verbs: [get, list, watch]
          - apiGroups: ["extensions"]
            resources:
              - daemonsets
              - deployments
              - deployments/scale
              - ingresses
              - replicasets
              - replicasets/scale
              - replicationcontrollers/scale
            verbs: [get, list, watch]
          - apiGroups: ["batch"]
            resources: [cronjobs, jobs]
            verbs: [get, list, watch]
          - apiGroups: ["events.k8s.io"]
            resources: [events]
            verbs: [get, list]
          - apiGroups: ["apiextensions.k8s.io"]
            resources: [customresourcedefinitions]
            verbs: [list, get]
          - apiGroups: ["networking.k8s.io"]
            resources: [ingresses, networkpolicies]
            verbs: [get, list, watch]
          - apiGroups: ["policy"]
            resources: [poddisruptionbudgets, podsecuritypolicies]
            verbs: [get, list]
          - apiGroups: ["monitoring.coreos.com"]
            resources:
              - alertmanagers
              - alertmanagerconfigs
              - prometheuses
              - prometheusagents
              - thanosrulers
              - scrapeconfigs
              - servicemonitors
              - podmonitors
              - probes
              - prometheusrules
            verbs: [get, list, watch]

    # ClusterRoleBinding
    - id: clusterrolebinding
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: ${schema.spec.name}-cluster-role-binding
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: ${schema.spec.name}-cluster-role
        subjects:
          - kind: ServiceAccount
            name: ${schema.spec.namespace}-${schema.spec.name}-service-account
            namespace: ${schema.spec.namespace}

    # ConfigMap for toolset configuration (matches Helm chart naming)
    - id: toolsetsconfigmap
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: custom-toolsets-configmap
          namespace: ${schema.spec.namespace}
        data:
          custom_toolset.yaml: |
            toolsets:
              internet:
                enabled: ${schema.spec.toolsets.internet.enabled}
              kubernetes/core:
                enabled: false
              kubernetes/logs:
                enabled: false
              prometheus/metrics:
                enabled: ${schema.spec.toolsets.prometheus.enabled}
              robusta:
                enabled: ${schema.spec.toolsets.robusta.enabled}
            mcp_servers:
              aks-mcp:
                config:
                  mode: ${schema.spec.mcp.mode}
                  url: ${schema.spec.mcp.url}
                description: "AKS MCP server with kubectl, helm, and az CLI for cluster operations and remediation"
                llm_instructions: |
                  You have access to AKS-MCP which provides kubectl, helm, and az CLI tools.

                  IMPORTANT: You are authorized to EXECUTE fixes, not just diagnose issues.

                  Available tools:
                  - kubectl_get: Get Kubernetes resources
                  - kubectl_describe: Get detailed resource info
                  - kubectl_logs: Get container logs
                  - kubectl_apply: Apply manifests to fix issues
                  - kubectl_patch: Patch resources to fix configuration
                  - kubectl_delete: Delete problematic resources
                  - kubectl_rollout: Restart deployments, check rollout status
                  - kubectl_scale: Scale deployments up/down
                  - kubectl_set: Update images, resources, env vars
                  - helm_list: List Helm releases
                  - helm_upgrade: Upgrade/fix Helm releases
                  - az_aks_show: Get AKS cluster info
                  - az_identity_show: Check managed identity config

                  REMEDIATION BEHAVIOR:
                  1. First diagnose the issue using kubectl_get, kubectl_describe, kubectl_logs
                  2. Identify the root cause
                  3. EXECUTE the fix using kubectl_patch, kubectl_set, kubectl_rollout, etc.
                  4. Verify the fix worked using kubectl_get

                  For common issues, execute these fixes directly:
                  - OOMKilled: kubectl_patch to increase memory limits
                  - ImagePullBackOff: kubectl_set image to correct tag
                  - CrashLoopBackOff: kubectl_logs to diagnose, then kubectl_rollout restart
                  - Pending pods: kubectl_describe to find cause, fix scheduling issues
                  - Service not working: kubectl_patch to fix selector labels

                  Always execute the fix and verify it worked before reporting back.
          model_list.yaml: |
            {}

    # ConfigMap for Holmes configuration
    - id: configconfigmap
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: holmes-config
          namespace: ${schema.spec.namespace}
        data:
          config.yaml: |
            # HolmesGPT configuration file
            # This file is mounted at /root/.holmes/config.yaml
            #
            # IMPORTANT: HolmesGPT only loads runbooks listed here explicitly.
            # No directory scanning or auto-discovery - each file must be listed.

            # Custom runbooks for AKS troubleshooting
            custom_runbooks:
              - /etc/holmes/runbooks/auto-remediation.yaml
              - /etc/holmes/runbooks/external-dns.yaml
              - /etc/holmes/runbooks/cert-manager.yaml
              - /etc/holmes/runbooks/external-secrets.yaml
              - /etc/holmes/runbooks/kyverno.yaml
              - /etc/holmes/runbooks/kro.yaml

            # Configuration
            max_steps: 50

    # ConfigMap for custom runbooks
    - id: runbooksconfigmap
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: holmes-custom-runbooks
          namespace: ${schema.spec.namespace}
        data:
          auto-remediation.yaml: |
            runbooks:
              - match:
                  issue_name: "(OOMKilled)|(Out.*Memory)|(memory.*exceeded)"
                instructions: >
                  AUTO-REMEDIATE: Pod killed due to memory limit exceeded.

                  **STEP 1: Diagnose**
                  Use kubectl_describe to get current memory limits
                  Use kubectl_logs to see what was happening before OOM

                  **STEP 2: FIX IT - Increase memory limits**
                  Execute: kubectl_patch deployment/<name> -n <namespace> --type=json -p='[{"op":"replace","path":"/spec/template/spec/containers/0/resources/limits/memory","value":"2Gi"}]'

                  **STEP 3: Verify**
                  Use kubectl_rollout status to confirm new pods are running
                  Use kubectl_get pods to verify no more OOMKilled

              - match:
                  issue_name: "(ImagePullBackOff)|(ErrImagePull)|(image.*not.*found)"
                instructions: >
                  AUTO-REMEDIATE: Cannot pull container image.

                  **STEP 1: Diagnose**
                  Use kubectl_describe pod to see exact image and error
                  Check if tag exists or if it's a registry auth issue

                  **STEP 2: FIX IT - Update to correct image**
                  If tag doesn't exist, use: kubectl_set image deployment/<name> <container>=<image>:latest -n <namespace>
                  If auth issue, check imagePullSecrets

                  **STEP 3: Verify**
                  Use kubectl_get pods -w to watch new pod start successfully

              - match:
                  issue_name: "(CrashLoopBackOff)|(crash.*loop)|(container.*restart)"
                instructions: >
                  AUTO-REMEDIATE: Container keeps crashing and restarting.

                  **STEP 1: Diagnose**
                  Use kubectl_logs --previous to see crash logs
                  Use kubectl_describe pod to see events and exit codes

                  **STEP 2: FIX IT based on cause**
                  - Config error: kubectl_patch to fix env vars or mounts
                  - Missing dependency: Check if required services exist
                  - Transient error: kubectl_rollout restart deployment/<name>

                  **STEP 3: Verify**
                  Use kubectl_get pods to confirm Running status with 0 restarts

              - match:
                  issue_name: "(Pending)|(pod.*pending)|(unschedulable)"
                instructions: >
                  AUTO-REMEDIATE: Pod stuck in Pending state.

                  **STEP 1: Diagnose**
                  Use kubectl_describe pod to see scheduling failure reason
                  Common: insufficient resources, node selector, taints

                  **STEP 2: FIX IT based on cause**
                  - Insufficient CPU/memory: kubectl_patch to reduce resource requests
                  - Node selector: kubectl_patch to fix or remove nodeSelector
                  - PVC pending: Check storage class and PVC status

                  **STEP 3: Verify**
                  Use kubectl_get pods to confirm pod is now Running

              - match:
                  issue_name: "(service.*not.*work)|(connection.*refused)|(no.*endpoint)"
                instructions: >
                  AUTO-REMEDIATE: Service not routing traffic to pods.

                  **STEP 1: Diagnose**
                  Use kubectl_get endpoints <service> to check if endpoints exist
                  Use kubectl_describe service to see selector
                  Use kubectl_get pods --show-labels to see pod labels

                  **STEP 2: FIX IT - Fix selector mismatch**
                  kubectl_patch service/<name> -n <namespace> --type=merge -p='{"spec":{"selector":{"app":"<correct-label>"}}}'

                  **STEP 3: Verify**
                  Use kubectl_get endpoints to confirm endpoints now populated

              - match:
                  issue_name: "(deployment.*not.*progressing)|(rollout.*stuck)|(replica.*unavailable)"
                instructions: >
                  AUTO-REMEDIATE: Deployment rollout stuck or not progressing.

                  **STEP 1: Diagnose**
                  Use kubectl_rollout status deployment/<name>
                  Use kubectl_describe deployment to see conditions
                  Use kubectl_get pods to see which pods are failing

                  **STEP 2: FIX IT**
                  If bad image: kubectl_rollout undo deployment/<name>
                  If resource issue: kubectl_patch to adjust resources
                  If stuck: kubectl_rollout restart deployment/<name>

                  **STEP 3: Verify**
                  Use kubectl_rollout status to confirm completion
          external-dns.yaml: |
            runbooks:
              - match:
                  issue_name: "(ExternalDNS)|(external-dns)|(DNS.*not.*creat)|(DNS.*record)|(Azure.*DNS)"
                instructions: >
                  Diagnose why external-dns is not creating DNS records in Azure DNS zones.

                  **Step 1: Check external-dns pod status**
                  kubectl get pods -n external-dns
                  kubectl logs -n external-dns deploy/external-dns --tail=200

                  **Step 2: Look for Azure-specific errors in logs**
                  - "AuthorizationFailed" or "AuthenticationFailed": Workload Identity not configured
                  - "does not have authorization": UAMI missing "DNS Zone Contributor" role
                  - "SubscriptionNotFound": Wrong subscription ID in deployment args
                  - "ResourceGroupNotFound": Wrong resource group for DNS zone

                  **Step 3: Verify Workload Identity setup**
                  kubectl get serviceaccount -n external-dns external-dns -o yaml
                  # Check for azure.workload.identity/client-id annotation
                  # Check for azure.workload.identity/use: "true" label on pods

                  **Step 4: Verify Azure DNS zone access**
                  # Check UAMI has role assignment on DNS zone:
                  az role assignment list --assignee <UAMI_CLIENT_ID> --scope /subscriptions/<SUB>/resourceGroups/<RG>/providers/Microsoft.Network/dnszones/<ZONE>

                  **Step 5: Check external-dns configuration**
                  kubectl get deploy -n external-dns external-dns -o yaml | grep -A 20 "args:"
                  # Verify: --provider=azure, --azure-resource-group, --domain-filter

                  **Step 6: Verify Services have correct annotations**
                  kubectl get svc -A -o jsonpath='{range .items[?(@.metadata.annotations.external-dns\.alpha\.kubernetes\.io/hostname)]}{.metadata.namespace}/{.metadata.name}: {.metadata.annotations.external-dns\.alpha\.kubernetes\.io/hostname}{"\n"}{end}'

                  **Common fixes:**
                  - Add DNS Zone Contributor role: az role assignment create --assignee <UAMI_CLIENT_ID> --role "DNS Zone Contributor" --scope <DNS_ZONE_ID>
                  - Restart external-dns after fixing: kubectl rollout restart deploy/external-dns -n external-dns
          cert-manager.yaml: |
            runbooks:
              - match:
                  issue_name: "(Certificate)|(cert-manager)|(TLS)|(ACME)|(Let.*Encrypt)|(Azure.*Key.*Vault)"
                instructions: >
                  Diagnose why cert-manager is not issuing certificates on AKS.

                  **Step 1: Check cert-manager pods**
                  kubectl get pods -n cert-manager
                  # All three should be Running: controller, webhook, cainjector

                  **Step 2: Check Certificate status**
                  kubectl get certificate -A
                  kubectl describe certificate <name> -n <namespace>
                  # Look for Ready condition and error messages

                  **Step 3: Follow the certificate chain**
                  kubectl get certificaterequest -n <namespace>
                  kubectl get order -n <namespace>
                  kubectl get challenge -n <namespace>

                  **Step 4: For HTTP-01 challenges with Istio/AGIC**
                  - Istio: Check VirtualService routes /.well-known/acme-challenge/* to solver
                  - AGIC: Check Ingress annotations allow HTTP on port 80
                  - Test: curl -v http://<domain>/.well-known/acme-challenge/test

                  **Step 5: For DNS-01 challenges with Azure DNS**
                  - Check Workload Identity on cert-manager ServiceAccount:
                    kubectl get sa -n cert-manager cert-manager -o yaml
                  - Verify UAMI has "DNS Zone Contributor" role on Azure DNS zone
                  - Check ClusterIssuer config:
                    kubectl get clusterissuer <name> -o yaml
                  - Verify hostedZoneName, resourceGroupName, subscriptionID

                  **Step 6: Check cert-manager logs**
                  kubectl logs -n cert-manager deploy/cert-manager --tail=100
                  # Look for: "error", "failed", "denied", "unauthorized"

                  **Common AKS issues:**
                  - Workload Identity not federated: az identity federated-credential create
                  - Wrong DNS zone permissions: az role assignment create --role "DNS Zone Contributor"
                  - Istio blocking HTTP-01: Create VirtualService for ACME path
                  - Rate limited: Use staging issuer (acme-staging-v02)

                  **Quick fix - restart cert-manager:**
                  kubectl rollout restart deploy -n cert-manager

              - match:
                  issue_name: "(webhook)|(cert-manager.*timeout)|(cert-manager.*connection)|(admission.*webhook)"
                instructions: >
                  Diagnose cert-manager webhook issues on AKS.

                  **Step 1: Check webhook pod**
                  kubectl get pods -n cert-manager -l app.kubernetes.io/component=webhook
                  kubectl logs -n cert-manager deploy/cert-manager-webhook --tail=50

                  **Step 2: Verify webhook service**
                  kubectl get svc -n cert-manager cert-manager-webhook
                  kubectl get endpoints -n cert-manager cert-manager-webhook
                  # Endpoints should NOT be empty

                  **Step 3: Check webhook configurations**
                  kubectl get validatingwebhookconfiguration cert-manager-webhook
                  kubectl get mutatingwebhookconfiguration cert-manager-webhook

                  **Step 4: AKS-specific checks**
                  - Check if API server can reach webhook (private cluster may need firewall rule)
                  - Verify no NetworkPolicy blocking kube-system → cert-manager
                  - Check if AKS egress firewall allows webhook traffic

                  **Quick fix - restart webhook:**
                  kubectl rollout restart deploy/cert-manager-webhook -n cert-manager
                  kubectl rollout restart deploy/cert-manager-cainjector -n cert-manager
          external-secrets.yaml: |
            runbooks:
              - match:
                  issue_name: "(ExternalSecret)|(external-secrets)|(SecretStore)|(Azure.*Key.*Vault)|(secret.*sync)"
                instructions: >
                  Diagnose External Secrets Operator (ESO) issues with Azure Key Vault on AKS.

                  **Step 1: Check ESO pods**
                  kubectl get pods -n external-secrets
                  kubectl logs -n external-secrets deploy/external-secrets --tail=100

                  **Step 2: Check SecretStore/ClusterSecretStore status**
                  kubectl get secretstore,clustersecretstore -A
                  kubectl describe clustersecretstore <name>
                  # Look for Ready condition and any error messages

                  **Step 3: Check ExternalSecret status**
                  kubectl get externalsecret -A
                  kubectl describe externalsecret <name> -n <namespace>
                  # Check: status.conditions, status.syncedResourceVersion

                  **Step 4: Verify Workload Identity setup for ESO**
                  kubectl get sa -n external-secrets external-secrets -o yaml
                  # Must have: azure.workload.identity/client-id annotation
                  # Pod must have: azure.workload.identity/use: "true" label

                  **Step 5: Check Azure Key Vault access**
                  # Verify UAMI has access policy or RBAC role on Key Vault:
                  az keyvault show --name <VAULT_NAME> --query "properties.accessPolicies"
                  # Or for RBAC:
                  az role assignment list --scope /subscriptions/<SUB>/resourceGroups/<RG>/providers/Microsoft.KeyVault/vaults/<VAULT>

                  **Step 6: Test Key Vault connectivity from pod**
                  kubectl exec -n external-secrets deploy/external-secrets -- \
                    curl -s -H "Metadata: true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net"

                  **Common Azure issues:**
                  - "AuthenticationFailed": Workload Identity not configured on SA
                  - "ForbiddenByPolicy": Key Vault access policy missing
                  - "SecretNotFound": Secret name doesn't exist in vault
                  - "NetworkError": Key Vault firewall blocking AKS

                  **Fixes:**
                  - Add Key Vault access: az keyvault set-policy --name <VAULT> --object-id <UAMI_PRINCIPAL_ID> --secret-permissions get list
                  - Or RBAC: az role assignment create --role "Key Vault Secrets User" --assignee <UAMI_CLIENT_ID> --scope <VAULT_ID>
                  - Restart ESO: kubectl rollout restart deploy/external-secrets -n external-secrets
          kyverno.yaml: |
            runbooks:
              - match:
                  issue_name: "(Kyverno)|(policy)|(PolicyException)|(ClusterPolicy)|(admission.*denied)|(blocked.*policy)"
                instructions: >
                  Diagnose Kyverno policy enforcement issues on AKS.

                  **Step 1: Check Kyverno pods**
                  kubectl get pods -n kyverno
                  # Should see: admission-controller, background-controller, cleanup-controller, reports-controller

                  **Step 2: If pods are failing, check logs**
                  kubectl logs -n kyverno deploy/kyverno-admission-controller --tail=100
                  kubectl logs -n kyverno deploy/kyverno-background-controller --tail=100

                  **Step 3: List policies and check status**
                  kubectl get clusterpolicy,policy -A
                  kubectl describe clusterpolicy <name>
                  # Check: status.ready, status.conditions

                  **Step 4: Check policy violations**
                  kubectl get policyreport,clusterpolicyreport -A
                  kubectl describe policyreport -n <namespace>
                  # Shows which resources violate which policies

                  **Step 5: Debug specific admission denial**
                  kubectl get events -A --field-selector reason=PolicyViolation
                  # Or check admission controller logs:
                  kubectl logs -n kyverno deploy/kyverno-admission-controller | grep -i "denied\|blocked\|violation"

                  **Step 6: Test policy in audit mode first**
                  # Change policy from "Enforce" to "Audit":
                  kubectl patch clusterpolicy <name> --type=merge -p '{"spec":{"validationFailureAction":"Audit"}}'

                  **Common issues:**
                  - "admission webhook denied": Policy blocking resource creation
                  - "webhook timeout": Kyverno pods overloaded or not ready
                  - "policy not ready": Policy has syntax errors
                  - Background scan failing: Check background-controller logs

                  **Fixes:**
                  - Exempt namespace: Add label `kyverno.io/ignore: "true"` to namespace
                  - Create PolicyException for specific resources
                  - Restart Kyverno: kubectl rollout restart deploy -n kyverno -l app.kubernetes.io/instance=kyverno

              - match:
                  issue_name: "(PolicyException)|(exemption)|(exclude.*policy)"
                instructions: >
                  Create a Kyverno PolicyException to exempt a resource.

                  **Step 1: Identify the policy blocking the resource**
                  kubectl get events -n <namespace> --field-selector reason=PolicyViolation

                  **Step 2: Create PolicyException**
                  kubectl apply -f - <<EOF
                  apiVersion: kyverno.io/v2
                  kind: PolicyException
                  metadata:
                    name: allow-<resource>
                    namespace: <namespace>
                  spec:
                    exceptions:
                    - policyName: <policy-name>
                      ruleNames:
                      - <rule-name>
                    match:
                      any:
                      - resources:
                          kinds:
                          - <Kind>
                          names:
                          - <resource-name>
                          namespaces:
                          - <namespace>
                  EOF

                  **Step 3: Verify exception is active**
                  kubectl get policyexception -n <namespace>
          kro.yaml: |
            runbooks:
              - match:
                  issue_name: "(KRO)|(ResourceGraphDefinition)|(ResourceGraph)|(kro\\.run)|(instance.*not.*ready)"
                instructions: >
                  Diagnose Kubernetes Resource Orchestrator (KRO) issues.

                  **Step 1: Check KRO controller**
                  kubectl get pods -n kro
                  kubectl logs -n kro deploy/kro-controller-manager --tail=100

                  **Step 2: Check ResourceGraphDefinition status**
                  kubectl get resourcegraphdefinition
                  kubectl describe resourcegraphdefinition <name>
                  # Check: status.state (should be "Active")
                  # Look for schema validation errors

                  **Step 3: Check instance status**
                  kubectl get <kind> -n <namespace>  # e.g., kubectl get holmes -n kro
                  kubectl describe <kind> <name> -n <namespace>
                  # Check status.conditions:
                  # - InstanceManaged: finalizers and labels set
                  # - GraphResolved: all resources resolved
                  # - ResourcesReady: all child resources ready

                  **Step 4: Check child resources**
                  # KRO creates resources with owner reference to instance
                  kubectl get all -n <target-namespace> -l kro.run/instance=<instance-name>

                  **Step 5: Debug resource creation failures**
                  kubectl get events -n <target-namespace> --sort-by='.lastTimestamp'
                  # Look for errors in Namespace, Deployment, Service, ConfigMap creation

                  **Step 6: Common KRO expression errors**
                  # Check RGD for CEL expression issues:
                  kubectl get resourcegraphdefinition <name> -o yaml | grep -A 5 "readyWhen\|template"
                  # Common: referencing .status fields before resource exists

                  **Common issues:**
                  - "schema validation failed": Invalid field types in RGD spec
                  - "failed evaluating expression": CEL expression error (e.g., missing status field)
                  - "resource not ready": Child resource hasn't reached ready state
                  - "already exists": Resource name conflict with existing resource

                  **Fixes:**
                  - Delete and recreate instance: kubectl delete <kind> <name> -n kro && kubectl apply -f instance.yaml
                  - Check RGD schema matches instance spec
                  - Ensure readyWhen expressions handle missing fields: use `|| false` for safety
                  - Restart KRO controller: kubectl rollout restart deploy/kro-controller-manager -n kro

              - match:
                  issue_name: "(RGD.*error)|(ResourceGraphDefinition.*failed)|(schema.*invalid)"
                instructions: >
                  Debug ResourceGraphDefinition schema and template errors.

                  **Step 1: Get RGD status**
                  kubectl get resourcegraphdefinition <name> -o jsonpath='{.status}'

                  **Step 2: Check for schema errors**
                  kubectl describe resourcegraphdefinition <name>
                  # Look at status.conditions for schema validation errors

                  **Step 3: Validate schema types**
                  # Common schema type issues:
                  # - Use "string" not "String"
                  # - Use "integer" not "int"
                  # - Use "boolean" not "bool"
                  # - Default values must match type: `string | default="true"` not `default=true`

                  **Step 4: Check template variable references**
                  # Variables must use ${} syntax: ${schema.spec.name}
                  # Nested references: ${schema.spec.config.setting}

                  **Step 5: Fix and reapply**
                  kubectl apply -f <rgd-file>.yaml
                  # KRO will revalidate and update status

    # Deployment
    - id: deployment
      readyWhen:
        - ${deployment.status.availableReplicas == deployment.spec.replicas}
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.namespace}-${schema.spec.name}
          namespace: ${schema.spec.namespace}
          labels:
            app: ${schema.spec.name}
        spec:
          replicas: ${schema.spec.deployment.replicas}
          revisionHistoryLimit: 10
          selector:
            matchLabels:
              app: ${schema.spec.name}
          template:
            metadata:
              labels:
                app: ${schema.spec.name}
                azure.workload.identity/use: "true"
            spec:
              serviceAccountName: ${schema.spec.namespace}-${schema.spec.name}-service-account
              containers:
                - name: holmes
                  image: ${schema.spec.deployment.image}
                  imagePullPolicy: Always
                  command: ["python3", "-u", "server.py"]
                  ports:
                    - containerPort: 5050
                      name: http
                  livenessProbe:
                    tcpSocket:
                      port: 5050
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 5
                  readinessProbe:
                    tcpSocket:
                      port: 5050
                    initialDelaySeconds: 15
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 5
                  env:
                    - name: LOG_LEVEL
                      value: INFO
                    - name: ENABLE_TELEMETRY
                      value: "false"
                    - name: OPENAI_API_KEY
                      value: "sk-litellm-proxy"
                    - name: OPENAI_API_BASE
                      value: ${schema.spec.llm.litellmBaseUrl}
                    - name: MODEL
                      value: ${schema.spec.llm.model}
                    - name: LITELLM_BASE_URL
                      value: ${schema.spec.llm.litellmBaseUrl}
                  lifecycle:
                    preStop:
                      exec:
                        command: ["bash", "-c", "kill -SIGINT 1"]
                  volumeMounts:
                    - name: playbooks-config-secret
                      mountPath: /etc/robusta/config
                    - name: custom-toolsets-configmap
                      mountPath: /etc/holmes/config
                    - name: custom-runbooks
                      mountPath: /etc/holmes/runbooks
                      readOnly: true
                    - name: holmes-config
                      mountPath: /root/.holmes/config.yaml
                      subPath: config.yaml
                      readOnly: true
                  resources:
                    requests:
                      cpu: ${schema.spec.deployment.resources.cpuRequest}
                      memory: ${schema.spec.deployment.resources.memoryRequest}
                    limits:
                      memory: ${schema.spec.deployment.resources.memoryLimit}
              volumes:
                - name: playbooks-config-secret
                  secret:
                    secretName: robusta-playbooks-config-secret
                    optional: true
                - name: custom-toolsets-configmap
                  configMap:
                    name: custom-toolsets-configmap
                    optional: true
                - name: custom-runbooks
                  configMap:
                    name: holmes-custom-runbooks
                - name: holmes-config
                  configMap:
                    name: holmes-config

    # Service
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.namespace}-${schema.spec.name}
          namespace: ${schema.spec.namespace}
          labels:
            app: ${schema.spec.name}
        spec:
          selector:
            app: ${schema.spec.name}
          ports:
            - name: http
              protocol: TCP
              port: 80
              targetPort: 5050
