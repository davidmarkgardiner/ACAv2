# cert-manager Certificate for RocketChat TLS
# IMPORTANT: Deploy to aks-istio-ingress namespace (same as Gateway)
#
# Prerequisites:
#   - cert-manager installed
#   - ClusterIssuer "letsencrypt-prod" configured
#
# Update YOUR_DOMAIN before applying
#
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rocketchat-tls
  namespace: aks-istio-ingress  # CRITICAL: Same namespace as Gateway
spec:
  secretName: rocketchat-tls-secret  # Referenced by Gateway credentialName
  issuerRef:
    name: letsencrypt-prod  # Your ClusterIssuer name
    kind: ClusterIssuer
  dnsNames:
    - "YOUR_DOMAIN"  # UPDATE: e.g., rocketchat.example.com
---
