# Required Secrets for RocketChat + HolmesGPT Stack
#
# DO NOT commit this file with real values!
# Copy and fill in values locally.
#
---
# HolmesGPT API Keys
# Choose at least one: OpenAI or Anthropic
apiVersion: v1
kind: Secret
metadata:
  name: holmes-secrets
  namespace: holmesgpt
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-your-openai-key-here"
  ANTHROPIC_API_KEY: "sk-ant-your-anthropic-key-here"
---
# GitLab Personal Access Token
# Required for creating issues from triage workflow
# Scopes needed: api, write_repository
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-mcp-secret
  namespace: argo-events
type: Opaque
stringData:
  GITLAB_PERSONAL_ACCESS_TOKEN: "glpat-your-token-here"
---
# RocketChat Webhook Configuration
# Update WEBHOOK_URL after creating Incoming Webhook in RocketChat
apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketchat-webhook-config
  namespace: argo-events
data:
  # Internal cluster URL format:
  # http://rocketchat.rocketchat.svc.cluster.local:3000/hooks/{HOOK_ID}/{TOKEN}
  WEBHOOK_URL: "http://rocketchat.rocketchat.svc.cluster.local:3000/hooks/PLACEHOLDER/PLACEHOLDER"
---
# Azure Storage Secret (for Argo artifact repository)
# Optional - only if using Azure Blob Storage
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-secret
  namespace: argo-events
type: Opaque
stringData:
  account-key: "your-azure-storage-account-key"
