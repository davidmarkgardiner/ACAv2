apiVersion: v1
kind: ConfigMap
metadata:
  name: holmes-proxy-script
  namespace: rocketchat
data:
  proxy.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json
    import urllib.request
    import urllib.error
    import sys
    import threading
    import os

    HOLMES_URL = "http://holmesgpt-holmes.holmesgpt.svc.cluster.local:80/api/chat"
    # Set this to your RocketChat incoming webhook URL
    ROCKETCHAT_WEBHOOK = os.environ.get('ROCKETCHAT_WEBHOOK', '')

    def call_holmes_async(question, channel, user):
        """Call Holmes and post response back to RocketChat"""
        try:
            print(f"Async: Calling Holmes for: {question}", file=sys.stderr, flush=True)

            holmes_payload = json.dumps({
                "ask": question,
                "conversation_history": [],
                "stream": False
            }).encode('utf-8')

            req = urllib.request.Request(
                HOLMES_URL,
                data=holmes_payload,
                headers={'Content-Type': 'application/json'}
            )

            with urllib.request.urlopen(req, timeout=180) as resp:
                raw = resp.read().decode('utf-8')
                result = json.loads(raw)
                response_text = result.get('analysis', 'No analysis available')
                if len(response_text) > 4000:
                    response_text = response_text[:4000] + "\n\n... (truncated)"

            print(f"Async: Got response, posting to RocketChat", file=sys.stderr, flush=True)

            # Post to RocketChat incoming webhook
            if ROCKETCHAT_WEBHOOK:
                rc_payload = json.dumps({
                    "channel": f"#{channel}",
                    "text": f"**Holmes Analysis** (requested by @{user}):\n\n{response_text}"
                }).encode('utf-8')

                rc_req = urllib.request.Request(
                    ROCKETCHAT_WEBHOOK,
                    data=rc_payload,
                    headers={'Content-Type': 'application/json'}
                )
                urllib.request.urlopen(rc_req, timeout=10)
                print(f"Async: Posted to RocketChat", file=sys.stderr, flush=True)
            else:
                print(f"Async: No webhook configured, response: {response_text[:200]}", file=sys.stderr, flush=True)

        except Exception as e:
            print(f"Async error: {str(e)}", file=sys.stderr, flush=True)

    class ProxyHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers.get('Content-Length', 0))
            body = self.rfile.read(content_length)
            print(f"Received: {body.decode()}", file=sys.stderr, flush=True)

            try:
                data = json.loads(body)
                text = data.get('text', '')
                channel = data.get('channel_name', 'general')
                user = data.get('user_name', 'unknown')

                question = text.replace('@holmes', '').strip()
                if not question:
                    question = 'What is the cluster status?'

                print(f"Question: {question}", file=sys.stderr, flush=True)

                # Start async processing
                thread = threading.Thread(
                    target=call_holmes_async,
                    args=(question, channel, user)
                )
                thread.daemon = True
                thread.start()

                # Return immediately with acknowledgment
                response = {"content": {"text": f"Analyzing: _{question}_\n\nPlease wait..."}}
                response_bytes = json.dumps(response).encode('utf-8')

                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(response_bytes)))
                self.end_headers()
                self.wfile.write(response_bytes)

            except Exception as e:
                print(f"Error: {str(e)}", file=sys.stderr, flush=True)
                error_response = {"content": {"text": f"Error: {str(e)}"}}
                error_bytes = json.dumps(error_response).encode('utf-8')
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(error_bytes)))
                self.end_headers()
                self.wfile.write(error_bytes)

    if __name__ == '__main__':
        print(f"Starting proxy on :8080, webhook: {ROCKETCHAT_WEBHOOK or 'NOT SET'}", flush=True)
        server = HTTPServer(('0.0.0.0', 8080), ProxyHandler)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes-proxy
  namespace: rocketchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holmes-proxy
  template:
    metadata:
      labels:
        app: holmes-proxy
    spec:
      containers:
      - name: proxy
        image: python:3.11-slim
        command: ["python", "/app/proxy.py"]
        ports:
        - containerPort: 8080
        env:
        - name: ROCKETCHAT_WEBHOOK
          value: "http://rocketchat.rocketchat.svc.cluster.local:3000/hooks/694b1105982439a1cae9fce0/SxW5B5bq2PcwNuJAnMzJ7vtNW3nktckH5eivJFZKBjhqm8z2"
        volumeMounts:
        - name: script
          mountPath: /app
      volumes:
      - name: script
        configMap:
          name: holmes-proxy-script
---
apiVersion: v1
kind: Service
metadata:
  name: holmes-proxy
  namespace: rocketchat
spec:
  selector:
    app: holmes-proxy
  ports:
  - port: 80
    targetPort: 8080
