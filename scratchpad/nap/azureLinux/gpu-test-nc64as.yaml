apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-nc64as-t4
  namespace: default
  labels:
    app: gpu-test
    sku: nc64as-t4
spec:
  restartPolicy: Never

  nodeSelector:
    gpu-sku: nc64as-t4-v3

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  containers:
    - name: gpu-test
      image: nvidia/cuda:12.3.1-base-ubuntu22.04
      command:
        - /bin/bash
        - -c
        - |
          echo "========================================="
          echo "GPU Test - NC64as_T4_v3 (Multi-GPU SKU)"
          echo "========================================="
          echo ""

          echo "=== System Information ==="
          uname -a
          cat /etc/os-release || true
          echo ""

          echo "=== NVIDIA SMI Output ==="
          nvidia-smi
          echo ""

          echo "=== GPU Details ==="
          nvidia-smi --query-gpu=index,name,driver_version,memory.total,memory.free,compute_cap --format=csv
          echo ""

          echo "=== GPU Count ==="
          GPU_COUNT=$(nvidia-smi --query-gpu=count --format=csv,noheader | head -1)
          echo "Available GPUs: $GPU_COUNT"
          echo ""

          echo "=== Node Information ==="
          echo "Node Name: $(hostname)"
          echo ""

          echo "========================================="
          echo "GPU Test Completed Successfully!"
          echo "SKU: NC64as_T4_v3 (4x T4 GPUs)"
          echo "========================================="

          sleep 300

      resources:
        requests:
          nvidia.com/gpu: 1
          memory: "64Gi"
          cpu: "16"
        limits:
          nvidia.com/gpu: 1
          memory: "64Gi"
          cpu: "16"
