apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-nc8as-t4
  namespace: default
  labels:
    app: gpu-test
    sku: nc8as-t4
spec:
  restartPolicy: Never

  nodeSelector:
    gpu-sku: nc8as-t4-v3

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  containers:
    - name: gpu-test
      image: nvidia/cuda:12.3.1-base-ubuntu22.04
      command:
        - /bin/bash
        - -c
        - |
          echo "========================================="
          echo "GPU Test - NC8as_T4_v3 (Medium SKU)"
          echo "========================================="
          echo ""

          echo "=== System Information ==="
          uname -a
          cat /etc/os-release || true
          echo ""

          echo "=== NVIDIA SMI Output ==="
          nvidia-smi
          echo ""

          echo "=== GPU Details ==="
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free,compute_cap --format=csv
          echo ""

          echo "=== Node Information ==="
          echo "Node Name: $(hostname)"
          echo ""

          echo "========================================="
          echo "GPU Test Completed Successfully!"
          echo "SKU: NC8as_T4_v3"
          echo "========================================="

          sleep 300

      resources:
        requests:
          nvidia.com/gpu: 1
          memory: "16Gi"
          cpu: "4"
        limits:
          nvidia.com/gpu: 1
          memory: "16Gi"
          cpu: "4"
