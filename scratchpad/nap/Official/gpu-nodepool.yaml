apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-pool
  annotations:
    kubernetes.io/description: GPU-enabled NodePool for AI/ML and compute-intensive workloads
spec:
  weight: 20  # Highest priority for GPU workloads
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 0s
    budgets:
      - nodes: "0"  # Prevent automatic disruption of GPU nodes
  template:
    metadata:
      labels:
        workload-type: gpu
        gpu-type: nvidia-t4
    spec:
      expireAfter: Never  # GPU nodes don't expire

      requirements:
        # Specific SKU for UK South - Tesla T4
        - key: karpenter.azure.com/sku-name
          operator: In
          values:
            - Standard_NC4as_T4_v3
            - Standard_NC8as_T4_v3
            - Standard_NC16as_T4_v3

        # On-demand capacity
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand

        # Architecture
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64

        # OS
        - key: kubernetes.io/os
          operator: In
          values:
            - linux

      # Taint to ensure only GPU workloads land on these nodes
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule

      # Reference to GPU node class
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: gpu-config

  # Resource limits to prevent runaway costs
  limits:
    cpu: "32"          # Max 32 CPUs (allows for 2x NC16as_T4_v3)
    memory: 200Gi      # Max 200GB memory
    nvidia.com/gpu: "4"  # Max 4 GPUs
