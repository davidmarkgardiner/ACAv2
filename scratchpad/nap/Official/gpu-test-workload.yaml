apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-workload
  namespace: default
  labels:
    app: gpu-test
spec:
  # Tolerate the GPU node taint
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  containers:
    - name: cuda-vectoradd
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda11.7.1-ubuntu20.04
      resources:
        requests:
          nvidia.com/gpu: 1  # Request 1 GPU
          cpu: "1"
          memory: "2Gi"
        limits:
          nvidia.com/gpu: 1  # Limit to 1 GPU
          cpu: "2"
          memory: "4Gi"

  restartPolicy: Never
