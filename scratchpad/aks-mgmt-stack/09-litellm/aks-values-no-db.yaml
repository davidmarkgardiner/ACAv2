# LiteLLM on AKS - NO DATABASE
# Use this when you only need LLM routing (no key management, spend tracking, or admin UI)
# Image: litellm (NOT litellm-database)
# No master_key = no auth required = no DB lookup

image:
  repository: ghcr.io/berriai/litellm
  tag: main-latest
  pullPolicy: Always

replicaCount: 1

# No DB
db:
  deployStandalone: false
  useExisting: false

postgresql:
  enabled: false

redis:
  enabled: false

# ServiceAccount for Azure Workload Identity
serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id: "<your-uami-client-id>"

podLabels:
  azure.workload.identity/use: "true"

proxy_config:
  litellm_settings:
    drop_params: true
    enable_azure_ad_token_refresh: true
  model_list:
    # Option 1: Azure OpenAI (uses UAMI for auth, no api_key needed)
    - model_name: gpt-4
      litellm_params:
        model: azure/<your-deployment-name>
        api_base: https://<your-resource>.openai.azure.com/
        api_version: "2024-02-15-preview"

    # Option 2: Self-hosted VLM on AKS (e.g. vLLM, KubeAI, TGI)
    - model_name: my-vlm
      litellm_params:
        model: openai/<model-name>
        api_base: http://<vlm-service>.<namespace>.svc.cluster.local/v1
        api_key: not-needed

# --- Install ---
# helm install litellm oci://ghcr.io/berriai/litellm-helm \
#   -n litellm --create-namespace \
#   -f aks-values-no-db.yaml
