# ============================================================
# Secret Template: gitea-credentials
# ============================================================
# Apply to the same namespace as your Argo Workflows
# (typically: argo or argo-events).
#
# USAGE:
#   1. Base64-encode each value:
#        echo -n 'https://gitea.lab.xxx' | base64
#   2. Fill in the <base64-encoded-*> placeholders below.
#   3. kubectl apply -f gitea-credentials-secret.yaml -n argo
#
# Or use the imperative form (avoids storing secrets in YAML):
#
#   kubectl create secret generic gitea-credentials \
#     --namespace argo \
#     --from-literal=url=https://gitea.lab.xxx \
#     --from-literal=token=<your-gitea-token> \
#     --from-literal=repo-owner=<owner> \
#     --from-literal=repo-name=<repo>
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: gitea-credentials
  namespace: argo          # ← change to match your Argo Workflow namespace
  labels:
    app.kubernetes.io/component: gitea-integration
    app.kubernetes.io/part-of: k8s-event-triage
  annotations:
    # Rotate this token via Gitea UI → User Settings → Applications
    # Minimum required permissions: issues (write)
    gitea.lab.xxx/token-permissions: "issues:write"
type: Opaque
stringData:
  # Gitea instance base URL — no trailing slash
  url: "https://gitea.lab.xxx"

  # Personal access token or bot account token
  # Gitea UI: User Settings → Applications → Generate Token
  # Minimum scope: "issues" (write)
  token: "<your-gitea-api-token>"

  # Repository owner (org or user)
  repo-owner: "<owner>"

  # Repository name
  repo-name: "<repo-name>"

---
# ============================================================
# Optional: Gitea Label Bootstrap Job
# ============================================================
# Run once to ensure the required labels exist in the target repo.
# Labels referenced by the workflow step:
#   triage, k8s-event, severity:critical, severity:high,
#   severity:medium, severity:low
# ============================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-label-bootstrap
  namespace: argo
  labels:
    app.kubernetes.io/part-of: k8s-event-triage
  annotations:
    # Run once; delete after success
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: label-bootstrap
          image: badouralix/curl-jq:alpine
          command: [sh, -c]
          args:
            - |
              set -e
              GITEA_URL=$(cat /etc/gitea/url)
              TOKEN=$(cat /etc/gitea/token)
              OWNER=$(cat /etc/gitea/repo-owner)
              REPO=$(cat /etc/gitea/repo-name)

              create_label() {
                NAME="$1"; COLOR="$2"; DESCRIPTION="$3"
                # Idempotent: ignore 422 (already exists)
                HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
                  --max-time 10 \
                  -X POST \
                  -H "Content-Type: application/json" \
                  -H "Authorization: token ${TOKEN}" \
                  "${GITEA_URL}/api/v1/repos/${OWNER}/${REPO}/labels" \
                  -d "{\"name\":\"${NAME}\",\"color\":\"${COLOR}\",\"description\":\"${DESCRIPTION}\"}")
                echo "  ${NAME}: HTTP ${HTTP}"
              }

              echo "Bootstrapping Gitea labels for ${OWNER}/${REPO}..."
              create_label "triage"            "#e11d48" "Triaged by automated workflow"
              create_label "k8s-event"         "#0ea5e9" "Kubernetes cluster event"
              create_label "severity:critical" "#dc2626" "LLM severity: critical"
              create_label "severity:high"     "#ea580c" "LLM severity: high"
              create_label "severity:medium"   "#ca8a04" "LLM severity: medium"
              create_label "severity:low"      "#16a34a" "LLM severity: low"
              echo "Done."

          volumeMounts:
            - name: gitea-creds
              mountPath: /etc/gitea
              readOnly: true

      volumes:
        - name: gitea-creds
          secret:
            secretName: gitea-credentials
