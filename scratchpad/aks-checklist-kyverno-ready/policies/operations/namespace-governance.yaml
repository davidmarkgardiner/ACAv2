---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-require-azure-tags
  annotations:
    policies.kyverno.io/title: Require Azure Tags Annotation
    policies.kyverno.io/category: Operations
    policies.kyverno.io/severity: low
    aks-checklist/section: Multi-Tenant - Isolation
    aks-checklist/item: "Use Azure tags in Azure Kubernetes Service"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-cost-center
      match:
        any:
          - resources:
              kinds:
                - Namespace
      validate:
        message: "Namespace should have 'cost-center' annotation for cost allocation."
        pattern:
          metadata:
            annotations:
              cost-center: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-gitops-labels
  annotations:
    policies.kyverno.io/title: GitOps Source Labels
    policies.kyverno.io/category: Operations
    policies.kyverno.io/severity: low
    aks-checklist/section: Cluster Operations
    aks-checklist/item: "Use GitOps to deploy workloads"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-gitops-labels
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
      validate:
        message: "Resources should be managed by GitOps (ArgoCD or Flux labels expected)."
        anyPattern:
          - metadata:
              labels:
                app.kubernetes.io/managed-by: "argocd | Helm | flux"
          - metadata:
              labels:
                argocd.argoproj.io/instance: "?*"
          - metadata:
              labels:
                kustomize.toolkit.fluxcd.io/name: "?*"
          - metadata:
              labels:
                helm.toolkit.fluxcd.io/name: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-require-annotations-documentation
  annotations:
    policies.kyverno.io/title: Require Documentation Annotations
    policies.kyverno.io/category: Operations
    policies.kyverno.io/severity: low
    aks-checklist/section: Cluster Operations
    aks-checklist/item: "Apply different types of labels to all resources"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-documentation
      match:
        any:
          - resources:
              kinds:
                - Deployment
      validate:
        message: "Deployments should have documentation annotation (description or docs-url)."
        anyPattern:
          - metadata:
              annotations:
                description: "?*"
          - metadata:
              annotations:
                docs-url: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-require-contact-labels
  annotations:
    policies.kyverno.io/title: Require Contact Labels
    policies.kyverno.io/category: Operations
    policies.kyverno.io/severity: medium
    aks-checklist/section: Cluster Operations
    aks-checklist/item: "Apply different types of labels to all resources"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-team-contact
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
      validate:
        message: "Workloads should have team contact information (team label or on-call annotation)."
        anyPattern:
          - metadata:
              labels:
                team: "?*"
          - metadata:
              annotations:
                on-call: "?*"
          - metadata:
              annotations:
                slack-channel: "?*"
