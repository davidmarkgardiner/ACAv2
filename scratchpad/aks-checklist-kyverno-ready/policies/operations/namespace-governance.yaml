# Operations Policies
# Maps to: Cluster Operations, Multi-Tenant sections of AKS Checklist
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-require-namespace-labels
  annotations:
    policies.kyverno.io/title: Require Namespace Labels
    policies.kyverno.io/category: Operations
    policies.kyverno.io/severity: medium
    aks-checklist/section: Multi-Tenant - Isolation
    aks-checklist/item: "Logically isolate cluster"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-owner-label
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - default
      validate:
        message: "Namespaces must have 'owner' and 'environment' labels."
        pattern:
          metadata:
            labels:
              owner: "?*"
              environment: "dev | test | staging | production | prod"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-require-resource-quota
  annotations:
    policies.kyverno.io/title: Require ResourceQuota
    policies.kyverno.io/category: Operations
    policies.kyverno.io/severity: high
    aks-checklist/section: Resource Management
    aks-checklist/item: "Enforce resource quotas for namespaces"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-quota-exists
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
      validate:
        message: "Namespace should have 'resource-quota-configured' label set to true."
        pattern:
          metadata:
            labels:
              resource-quota-configured: "true"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-require-limit-range
  annotations:
    policies.kyverno.io/title: Require LimitRange
    policies.kyverno.io/category: Operations
    policies.kyverno.io/severity: medium
    aks-checklist/section: Resource Management
    aks-checklist/item: "Namespaces should have LimitRange"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-limitrange-exists
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
