# Security Policies - Secrets and Image Security
# Maps to: Cluster Security, Image Management sections of AKS Checklist
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    aks-checklist/section: Cluster Security
    aks-checklist/item: "Use a private registry for your images, such as ACR"
    policies.kyverno.io/description: >-
      Images should only come from approved registries.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Images must be from approved registries (*.azurecr.io, mcr.microsoft.com)."
        pattern:
          spec:
            containers:
              - image: "*.azurecr.io/* | mcr.microsoft.com/*"
            =(initContainers):
              - image: "*.azurecr.io/* | mcr.microsoft.com/*"
            =(ephemeralContainers):
              - image: "*.azurecr.io/* | mcr.microsoft.com/*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    aks-checklist/section: Image Management
    aks-checklist/item: "Refresh container when base image is updated"
    policies.kyverno.io/description: >-
      Images should use specific tags, not 'latest'.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Using 'latest' tag is not allowed. Use a specific version tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest & !*:*latest*"
            =(initContainers):
              - image: "!*:latest & !*:*latest*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-require-image-digest
  annotations:
    policies.kyverno.io/title: Require Image Digest
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: low
    aks-checklist/section: Image Management
    aks-checklist/item: "Scan the container image against vulnerabilities"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-digest
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Images should use digests for immutability."
        pattern:
          spec:
            containers:
              - image: "*@sha256:*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-disallow-secrets-in-env
  annotations:
    policies.kyverno.io/title: Disallow Secrets in Environment Variables
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    aks-checklist/section: Application Deployment
    aks-checklist/item: "Store your secrets in Azure Key Vault"
    policies.kyverno.io/description: >-
      Secrets should not be exposed as environment variables, use volume mounts instead.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: secrets-not-from-env
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Secrets should be mounted as volumes, not exposed as environment variables."
        pattern:
          spec:
            containers:
              - =(env):
                  - =(valueFrom):
                      X(secretKeyRef): "null"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-require-imagepullpolicy
  annotations:
    policies.kyverno.io/title: Require ImagePullPolicy Always
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: low
    aks-checklist/section: Application Deployment
    aks-checklist/item: "Control the usage of imagePullPolicy"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: imagepullpolicy-always
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "ImagePullPolicy should be set to 'Always' for security."
        pattern:
          spec:
            containers:
              - imagePullPolicy: "Always"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-require-workload-identity
  annotations:
    policies.kyverno.io/title: Require Workload Identity Labels
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    aks-checklist/section: Application Deployment
    aks-checklist/item: "Implement Azure Workload Identity"
    policies.kyverno.io/description: >-
      Pods accessing Azure resources should use Workload Identity.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-workload-identity-label
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  azure.workload.identity/use: "true"
      validate:
        message: "Pods using Workload Identity must have the correct service account."
        pattern:
          spec:
            serviceAccountName: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-disallow-env-secrets-patterns
  annotations:
    policies.kyverno.io/title: Detect Hardcoded Secrets in Env
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: critical
    aks-checklist/section: Application Deployment
    aks-checklist/item: "Store your secrets in Azure Key Vault, don't inject passwords in Docker Images"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: no-password-env-vars
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
      validate:
        message: "Environment variables should not contain secrets (PASSWORD, SECRET, KEY, TOKEN patterns detected)."
        foreach:
          - list: "request.object.spec.containers[] | request.object.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.env[?contains(name, 'PASSWORD') || contains(name, 'SECRET') || contains(name, 'API_KEY') || contains(name, 'TOKEN')].value | length(@) }}"
                    operator: GreaterThan
                    value: 0
