# Application Deployment Policies
# Maps to: Application Deployment section of AKS Checklist
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aks-check-require-liveness-probe
  annotations:
    policies.kyverno.io/title: Require Liveness Probe
    policies.kyverno.io/category: Application
    policies.kyverno.io/severity: high
    aks-checklist/section: Application Deployment
    aks-checklist/item: "Implement a proper Liveness probe"
    policies.kyverno.io/description: >-
      Liveness probes help Kubernetes detect and restart unresponsive containers.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-liveness-probe
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: "Liveness probe is required for all containers."
        anyPattern:
          - spec:
              containers:
                - livenessProbe:
                    httpGet:
                      port: "?*"
          - spec:
              containers:
                - livenessProbe:
                    tcpSocket:
                      port: "?*"
          - spec:
              containers:
                - livenessProbe:
                    exec:
                      command: "?*"
          - spec:
              containers:
                - livenessProbe:
                    grpc:
                      port: "?*"
---
