# Test resources for secrets-images policies
---
# Pod with images from approved registries - should pass image registries policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-approved-registry
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0
  initContainers:
    - name: init
      image: mcr.microsoft.com/busybox:1.35
---
# Pod with image from unapproved registry - should fail image registries policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-unapproved-registry
  namespace: test-ns
spec:
  containers:
    - name: app
      image: docker.io/nginx:1.19
---
# Pod with specific version tag - should pass latest tag policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-version-tag
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0.0
  initContainers:
    - name: init
      image: mcr.microsoft.com/busybox:1.35
---
# Pod with latest tag - should fail latest tag policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-latest-tag
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:latest
---
# Pod with image digest - should pass image digest policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-with-digest
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp@sha256:abc123def456789
---
# Pod without image digest - should fail image digest policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-without-digest
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0.0
---
# Pod without secretKeyRef in env - should pass secrets in env policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-no-secret-env
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0
      env:
        - name: APP_CONFIG
          value: "production"
---
# Pod with secretKeyRef in env - should fail secrets in env policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-secret-env
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: password
---
# Pod with imagePullPolicy: Always - should pass imagepullpolicy policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-pull-always
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0
      imagePullPolicy: Always
---
# Pod with imagePullPolicy: IfNotPresent - should fail imagepullpolicy policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-pull-ifnotpresent
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0
      imagePullPolicy: IfNotPresent
---
# Pod with workload identity and serviceAccountName - should pass workload identity policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-workload-identity-sa
  namespace: test-ns
  labels:
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: my-workload-identity-sa
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0
---
# Pod with workload identity without serviceAccountName - should fail workload identity policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-workload-identity-no-sa
  namespace: test-ns
  labels:
    azure.workload.identity/use: "true"
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0
---
# Pod without workload identity - should skip workload identity policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-no-workload-identity-label
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0
---
# Pod without hardcoded secrets - should pass hardcoded secrets policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-no-hardcoded-secrets
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0
      env:
        - name: APP_NAME
          value: "myapp"
---
# Deployment without hardcoded secrets - should pass hardcoded secrets policy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-no-hardcoded-secrets
  namespace: test-ns
  labels:
    app.kubernetes.io/name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-app
    spec:
      containers:
        - name: app
          image: myregistry.azurecr.io/myapp:1.0
          env:
            - name: APP_NAME
              value: "myapp"
---
# Pod with hardcoded PASSWORD env - should fail hardcoded secrets policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-hardcoded-password
  namespace: test-ns
spec:
  containers:
    - name: app
      image: myregistry.azurecr.io/myapp:1.0
      env:
        - name: DB_PASSWORD
          value: "supersecret123"
---
# Deployment with hardcoded API_KEY env - should fail hardcoded secrets policy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-hardcoded-apikey
  namespace: test-ns
  labels:
    app.kubernetes.io/name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-app
    spec:
      containers:
        - name: app
          image: myregistry.azurecr.io/myapp:1.0
          env:
            - name: API_KEY
              value: "sk-1234567890"
