apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aks-secrets-images-test
policies:
  - ../../policies/security/secrets-images.yaml
resources:
  - secrets-images-resources.yaml
results:
  # aks-check-restrict-image-registries tests
  - kind: Pod
    policy: aks-check-restrict-image-registries
    rule: validate-registries
    resources:
      - pod-approved-registry
    result: pass
  - kind: Pod
    policy: aks-check-restrict-image-registries
    rule: validate-registries
    resources:
      - pod-unapproved-registry
    result: fail
  # aks-check-disallow-latest-tag tests
  - kind: Pod
    policy: aks-check-disallow-latest-tag
    rule: disallow-latest-tag
    resources:
      - pod-version-tag
    result: pass
  - kind: Pod
    policy: aks-check-disallow-latest-tag
    rule: disallow-latest-tag
    resources:
      - pod-latest-tag
    result: fail
  # aks-check-require-image-digest tests
  - kind: Pod
    policy: aks-check-require-image-digest
    rule: require-digest
    resources:
      - pod-with-digest
    result: pass
  - kind: Pod
    policy: aks-check-require-image-digest
    rule: require-digest
    resources:
      - pod-without-digest
    result: fail
  # aks-check-disallow-secrets-in-env tests
  - kind: Pod
    policy: aks-check-disallow-secrets-in-env
    rule: secrets-not-from-env
    resources:
      - pod-no-secret-env
    result: pass
  - kind: Pod
    policy: aks-check-disallow-secrets-in-env
    rule: secrets-not-from-env
    resources:
      - pod-secret-env
    result: fail
  # aks-check-require-imagepullpolicy tests
  - kind: Pod
    policy: aks-check-require-imagepullpolicy
    rule: imagepullpolicy-always
    resources:
      - pod-pull-always
    result: pass
  - kind: Pod
    policy: aks-check-require-imagepullpolicy
    rule: imagepullpolicy-always
    resources:
      - pod-pull-ifnotpresent
    result: fail
  # aks-check-require-workload-identity tests
  - kind: Pod
    policy: aks-check-require-workload-identity
    rule: check-workload-identity-label
    resources:
      - pod-workload-identity-sa
    result: pass
  - kind: Pod
    policy: aks-check-require-workload-identity
    rule: check-workload-identity-label
    resources:
      - pod-workload-identity-no-sa
    result: fail
  - kind: Pod
    policy: aks-check-require-workload-identity
    rule: check-workload-identity-label
    resources:
      - pod-no-workload-identity-label
    result: skip
  # aks-check-disallow-env-secrets-patterns tests
  - kind: Pod
    policy: aks-check-disallow-env-secrets-patterns
    rule: no-password-env-vars
    resources:
      - pod-no-hardcoded-secrets
    result: pass
  - kind: Pod
    policy: aks-check-disallow-env-secrets-patterns
    rule: no-password-env-vars
    resources:
      - pod-hardcoded-password
    result: fail
  - kind: Deployment
    policy: aks-check-disallow-env-secrets-patterns
    rule: no-password-env-vars
    resources:
      - deployment-no-hardcoded-secrets
    result: pass
  - kind: Deployment
    policy: aks-check-disallow-env-secrets-patterns
    rule: no-password-env-vars
    resources:
      - deployment-hardcoded-apikey
    result: fail
