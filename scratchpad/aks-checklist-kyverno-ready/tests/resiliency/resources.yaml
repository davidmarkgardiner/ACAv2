# Test resources for bc-dr-policies
---
# Critical deployment with zone topology spread - should pass zone spread policy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-deployment-with-zone-spread
  namespace: test-ns
  labels:
    app.kubernetes.io/name: my-app
    criticality: high
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-app
    spec:
      topologySpreadConstraints:
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: my-app
      containers:
        - name: app
          image: nginx:1.19
---
# Critical deployment without zone topology spread - should fail zone spread policy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-deployment-no-zone-spread
  namespace: test-ns
  labels:
    app.kubernetes.io/name: my-app
    criticality: high
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-app
    spec:
      containers:
        - name: app
          image: nginx:1.19
---
# Non-critical deployment - should skip zone spread policy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: non-critical-deployment
  namespace: test-ns
  labels:
    app.kubernetes.io/name: my-app
    criticality: low
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-app
    spec:
      containers:
        - name: app
          image: nginx:1.19
---
# Deployment with 3+ replicas and antiaffinity (preferred) - should pass multi-replica antiaffinity policy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-3-replicas-antiaffinity
  namespace: test-ns
  labels:
    app.kubernetes.io/name: my-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-app
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: my-app
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: nginx:1.19
---
# Deployment with 3+ replicas without antiaffinity - should fail multi-replica antiaffinity policy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-3-replicas-no-antiaffinity
  namespace: test-ns
  labels:
    app.kubernetes.io/name: my-app
spec:
