# Test resources for resource-management policies
---
# Pod with CPU and memory limits - should pass resource limits policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-with-limits
  namespace: test-ns
spec:
  containers:
    - name: app
      image: nginx:1.19
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
        requests:
          cpu: "200m"
          memory: "128Mi"
---
# Pod without CPU limit - should fail resource limits policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-without-cpu-limit
  namespace: test-ns
spec:
  containers:
    - name: app
      image: nginx:1.19
      resources:
        limits:
          memory: "256Mi"
        requests:
          cpu: "200m"
          memory: "128Mi"
---
# Pod without memory limit - should fail resource limits policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-without-memory-limit
  namespace: test-ns
spec:
  containers:
    - name: app
      image: nginx:1.19
      resources:
        limits:
          cpu: "500m"
        requests:
          cpu: "200m"
          memory: "128Mi"
---
# Pod with CPU and memory requests - should pass resource requests policy
apiVersion: v1
kind: Pod
metadata:
