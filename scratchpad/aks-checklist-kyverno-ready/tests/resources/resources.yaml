---
# Pod with reasonable CPU limit/request ratio (5x) - should pass CPU ratio policy
apiVersion: v1
kind: Pod
metadata:
  name: pod-reasonable-cpu-ratio
  namespace: test-ns
spec:
  containers:
    - name: app
      image: nginx:1.19
      resources:
        limits:
          cpu: "1000m"
          memory: "256Mi"
        requests:
          cpu: "200m"
          memory: "128Mi"
---
