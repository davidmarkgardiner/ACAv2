      resources:
        limits:
          cpu: "200m"
          memory: "256Mi"
        requests:
          cpu: "200m"
          memory: "256Mi"
---
# Pod with requests != limits (Burstable QoS) - should fail QoS recommendation policy
apiVersion: v1
