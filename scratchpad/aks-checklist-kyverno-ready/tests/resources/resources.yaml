---
# Deployment with pdb-configured label - should pass PDB requirement policy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-with-pdb-label
  namespace: test-ns
  labels:
    app.kubernetes.io/name: my-app
    pdb-configured: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-app
    spec:
      containers:
        - name: app
          image: nginx:1.19
---
# Deployment without pdb-configured label - should fail PDB requirement policy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-without-pdb-label
  namespace: test-ns
  labels:
    app.kubernetes.io/name: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-app
    spec:
      containers:
        - name: app
          image: nginx:1.19
---
# Deployment with single replica - should skip PDB requirement policy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-single-replica-pdb
  namespace: test-ns
  labels:
    app.kubernetes.io/name: my-app
spec:
