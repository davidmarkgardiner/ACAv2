name: Trigger auto deployment for ca-hello-world-dev

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main-clean ]
    paths:
    - '**'
    - '.github/workflows/ca-hello-world-dev-AutoDeployTrigger-4f622c5a-1f40-4a33-917d-3bb2dab264b5.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CAHELLOWORLDDEV_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.CAHELLOWORLDDEV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAHELLOWORLDDEV_REGISTRY_PASSWORD }}
          containerAppName: ca-hello-world-dev
          resourceGroup: rg-aca-demo
          imageToBuild: davidgardiner/azurefunctionsimage:${{ github.sha }}
          
            

     

